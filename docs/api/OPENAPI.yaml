# Legacy snapshot. The maintained contract is docs/openapi/openapi.yaml (guarded by
# tests/openapi_reconciliation_test.mjs). This file keeps only live paths; the six
# retired 2026-11-07 paths (home/sdui, flash-sales/stream, presigned-url,
# sub-orders shipment, sdui/layouts, settlements/execute) were removed.
openapi: 3.0.3
info:
  title: OLMOA Open Market Platform API (legacy snapshot)
  version: 1.0.0
  description: Legacy snapshot — see docs/openapi/openapi.yaml for the maintained specification.
servers:
  - url: https://olmoa-api.dnjstjqppk.workers.dev
    description: Production Workers API

security:
  - BearerAuth: []

paths:
  /api/v1/products:
    $ref: './paths/storefront.yaml#/paths/~1api~1v1~1products'
  /api/v1/products/{id}:
    $ref: './paths/storefront.yaml#/paths/~1api~1v1~1products~1{id}'
  /api/v1/orders/checkout:
    $ref: './paths/storefront.yaml#/paths/~1api~1v1~1orders~1checkout'

  /api/v1/partner/products:
    $ref: './paths/partner.yaml#/paths/~1api~1v1~1partner~1products'
  /api/v1/partner/products/bulk:
    $ref: './paths/partner.yaml#/paths/~1api~1v1~1partner~1products~1bulk'
  /api/v1/partner/settlements:
    $ref: './paths/partner.yaml#/paths/~1api~1v1~1partner~1settlements'

  /api/v1/admin/partners/{id}/verify:
    $ref: './paths/admin.yaml#/paths/~1api~1v1~1admin~1partners~1{id}~1verify'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
