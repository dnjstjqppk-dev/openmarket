openapi: 3.0.3
info:
  title: OLMOA OpenMarket API
  version: 2.0.0-v3-integrity
  description: Contract for the Cloudflare Workers gateway (apps/cloudflare-gateway),
    the Vue 3 storefront/admin/partner apps, and the Flutter mobile apps.
    Reconciled against the implementation 2026-11-07, extended 2026-11-09
    (auth / payments / orders / channels / partner wave 1) and 2026-11-10
    (full-gateway wave 2, 201 paths) and 2026-11-20
    (sourcing/distribution, 209 paths) and 2026-11-20
    (fulfillment orchestration, 215 paths) and 2026-11-20
    (SEO crawl ops, 219 paths); every path below is
    covered by tests/openapi_reconciliation_test.mjs.
servers:
  - url: https://api.olmoa.com
    description: Production Workers gateway
  - url: http://localhost:8787
    description: Local wrangler dev gateway

