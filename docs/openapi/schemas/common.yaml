# Shared schemas. Reconciled 2026-11-07 against the gateway implementation
# (apps/cloudflare-gateway/src). Rules: ids are opaque strings (prod_/sku_/ord_
# prefixes), never UUIDs; list pagination is offset page/per_page, never cursor.
components:
  parameters:
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: false
      description: >
        Optional replay guard for checkout-class writes. When the same customer
        replays the same key the original result is returned (idempotent_replay).
        services/orders.js accepts ^[A-Za-z0-9_.:-]{8,100}$; checkout also accepts
        the same value as body.idempotency_key.
      schema:
        type: string
        minLength: 8
        maxLength: 100
        pattern: '^[A-Za-z0-9_.:-]{8,100}$'

  schemas:
    Role:
      type: string
      enum: [ROLE_CUSTOMER, ROLE_PARTNER, ROLE_ADMIN]

    ErrorResponse:
      description: Standard failure envelope from lib/http.js errorResponse.
      type: object
      required: [success, code, error]
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          maxLength: 64
          example: STOCK_INSUFFICIENT
        error:
          type: string
          maxLength: 500
          example: 재고가 부족하여 주문할 수 없습니다.

    OffsetPageMeta:
      description: Offset pagination envelope used by list endpoints.
      type: object
      required: [page, per_page, total, total_pages]
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 1

    ProductSummary:
      description: One row of GET /api/v1/products (product columns plus catalog joins).
      type: object
      required: [id, title]
      properties:
        id:
          type: string
          example: prod_001
        slug:
          type: string
          description: Alias of id kept for storefront links.
        title:
          type: string
        thumbnail_url:
          type: string
        lowest_original_price:
          type: integer
        lowest_sale_price:
          type: integer
        total_sold_count:
          type: integer
        brand:
          type: string
          description: Partner business name, or OLMOA DIRECT.
        partner_name:
          type: string
        category_name:
          type: string
          nullable: true
        category_slug:
          type: string
          nullable: true
        default_sku_id:
          type: string
          nullable: true
        avg_rating:
          type: number
          nullable: true
        review_count:
          type: integer

    SkuItem:
      description: One product_skus row (option_combination_json is a JSON string).
      type: object
      required: [id, product_id, sku_code, original_price, sale_price, stock_quantity, status]
      properties:
        id:
          type: string
          example: sku_001a
        product_id:
          type: string
        sku_code:
          type: string
          maxLength: 64
        option_combination_json:
          type: string
          example: '{"색상":"블랙","용량":"128GB"}'
        original_price:
          type: integer
          minimum: 0
        sale_price:
          type: integer
          minimum: 0
        stock_quantity:
          type: integer
          minimum: 0
        safety_stock:
          type: integer
        status:
          type: string
          enum: [IN_STOCK, OUT_OF_STOCK]

    SimpleSuccessResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
