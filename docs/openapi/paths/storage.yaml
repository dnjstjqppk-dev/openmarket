# Storage paths. Verified against the gateway implementation
# (apps/cloudflare-gateway/src/routes/storage.js). This is the live upload
# endpoint that replaces the retired POST /api/v1/partner/media/presigned-url
# doc: files are POSTed here directly (no presigned-URL round trip) and served
# back from /api/v1/storage/file/*.
paths:
  /api/v1/storage/upload:
    post:
      summary: Upload a media file (R2 when bound, else D1-embedded fallback)
      tags: [Storage]
      description: >
        Any authenticated role may upload. folder=kyb (seller KYB documents) is
        partner-only, restricted to PDF/JPG/PNG, and served PRIVATE; everything
        else is PUBLIC. Files over 10MB are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_data]
              properties:
                file_data:
                  type: string
                  format: byte
                  description: Base64 bytes (alias base64). A data:...;base64, prefix is stripped.
                file_name:
                  type: string
                  default: upload.png
                content_type:
                  type: string
                  default: image/png
                folder:
                  type: string
                  default: products
                  description: Lowercased, sanitised to [a-z0-9-], max 30 chars.
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                folder:
                  type: string
                  default: products
      responses:
        '201':
          description: File stored, metadata in storage_objects
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  brand:
                    type: string
                  data:
                    type: object
                    required: [file_id, original_name, content_type, byte_size, storage_backend, public_url, visibility, uploaded_at]
                    properties:
                      file_id:
                        type: string
                        example: products/obj_abc123.png
                      original_name:
                        type: string
                      content_type:
                        type: string
                        enum: [image/jpeg, image/png, image/webp, image/gif, application/pdf]
                      byte_size:
                        type: integer
                      storage_backend:
                        type: string
                        enum: [R2_BUCKET, D1_EMBEDDED]
                      public_url:
                        type: string
                      visibility:
                        type: string
                        enum: [PUBLIC, PRIVATE]
                      uploaded_at:
                        type: string
                        format: date-time
        '400':
          description: Missing file_data, disallowed type, oversize, or kyb type violation
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Non-partner upload to the kyb folder
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported Content-Type for upload
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'
