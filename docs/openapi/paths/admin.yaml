# Admin paths. Verified against the gateway implementation
# (apps/cloudflare-gateway/src/routes/admin.js, finance.js). Every route requires
# a ROLE_ADMIN JWT; mutations write admin_audit_log.
# Retired 2026-11-07: PUT /api/v1/admin/sdui/layouts never had a route behind it.
# POST /api/v1/admin/settlements/execute never existed; per-settlement approval
# itself is retired (POST /api/v1/admin/settlements/{id}/approve answers
# 410 USE_PAYOUT_ENGINE) — seller payouts go through POST
# /api/v1/admin/finance/payouts below.
paths:
  /api/v1/admin/partners/{id}/verify:
    put:
      summary: Approve, reject or suspend a partner with risk tiering
      tags: [Admin]
      description: >
        POST is accepted as an alias of PUT. KYB applicants (applied_at set,
        kyc_status not APPROVED) cannot be approved here: 409
        USE_APPLICATION_REVIEW directs to the document review endpoint.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Partner id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [APPROVED, REJECTED, SUSPENDED, PENDING]
                risk_tier:
                  type: string
                  enum: [TIER_1_NORMAL, TIER_2_WATCH, TIER_3_HIGH_RISK]
                  default: TIER_1_NORMAL
                rolling_reserve_pct:
                  type: number
                  description: 0..50 with at most 2 decimals. Defaults to 10/5/0 by risk tier.
                rolling_reserve_days:
                  type: integer
                  minimum: 1
                  maximum: 365
                  default: 90
                kyc_notes:
                  type: string
                  maxLength: 2000
      responses:
        '200':
          description: Partner status updated and audited
          content:
            application/json:
              schema:
                type: object
                required: [success, partner_id, status, risk_tier, rolling_reserve_pct, rolling_reserve_days, data]
                properties:
                  success:
                    type: boolean
                  brand:
                    type: string
                  partner_id:
                    type: string
                  status:
                    type: string
                  risk_tier:
                    type: string
                  rolling_reserve_pct:
                    type: number
                  rolling_reserve_days:
                    type: integer
                  kyc_notes:
                    type: string
                    nullable: true
                  data:
                    type: object
        '400':
          description: INVALID_STATUS, INVALID_RISK_TIER, INVALID_RESERVE_PCT, INVALID_RESERVE_DAYS
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Unknown partner id
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'
        '409':
          description: USE_APPLICATION_REVIEW
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'

  /api/v1/admin/users/{id}/reset-password:
    post:
      summary: Operator password reset (supported recovery while mail is unintegrated)
      tags: [Admin]
      description: >
        P2R-01: sets a policy-checked password, revokes every session
        (token_version+1), clears lockout, and writes USER_PASSWORD_RESET to the
        audit log. ROLE_ADMIN targets are refused (operator recovery stays a
        break-glass DB procedure). The password never echoes back.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: User id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password:
                  type: string
                  minLength: 10
                  maxLength: 128
                  description: 3 of 4 classes (lower/upper/digit/symbol).
      responses:
        '200':
          description: Password reset and audited
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          description: WEAK_PASSWORD
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Non-admin caller, or a ROLE_ADMIN reset target
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Unknown user id
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'

  /api/v1/admin/finance/payouts:
    get:
      summary: Payout history plus per-seller payable previews
      tags: [Admin]
      responses:
        '200':
          description: Payouts (latest 200) and pending payable previews
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [payouts, pending]
                    properties:
                      payouts:
                        type: array
                        items:
                          type: object
                      pending:
                        type: array
                        items:
                          type: object
                          required: [partner_id, amount]
                          properties:
                            partner_id:
                              type: string
                            business_name:
                              type: string
                            settlements:
                              type: integer
                            carried_adjustments:
                              type: integer
                            gross_amount:
                              type: integer
                            reserve_to_hold:
                              type: integer
                            reserve_to_release:
                              type: integer
                            amount:
                              type: integer
                            reserve_outstanding:
                              type: integer
                            next_reserve_release:
                              type: string
                              nullable: true
    post:
      summary: Create an APPROVED seller payout from eligible settlements
      tags: [Admin]
      description: >
        One payout covers ONE operating entity; other_entities_pending flags
        sellers with payable balances under another entity. The payout is a
        ledger + approval record only — the operator transfers money manually at
        a bank and then records the reference with POST
        /api/v1/admin/finance/payouts/{id}/transferred. A batch assertion aborts
        the commit when a concurrent refund/cancel drifted the preview.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partner_id]
              properties:
                partner_id:
                  type: string
      responses:
        '201':
          description: Payout approved
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [payout_id, amount, settlement_count, bank_transfer]
                    properties:
                      payout_id:
                        type: string
                      amount:
                        type: integer
                      gross_amount:
                        type: integer
                      reserve_held:
                        type: integer
                      reserve_released:
                        type: integer
                      reserve_release_days:
                        type: integer
                        nullable: true
                      operator_entity_id:
                        type: string
                      other_entities_pending:
                        type: boolean
                      settlement_count:
                        type: integer
                      bank_transfer:
                        type: string
        '404':
          description: Unknown partner id
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'
        '409':
          description: PAYOUT_ACCOUNT_UNVERIFIED, NOTHING_TO_PAY, NEGATIVE_BALANCE_CARRIED
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'

  /api/v1/admin/dashboard:
    get:
      summary: Operator dashboard metrics (GMV, counts, open claims, pending payouts)
      tags: [Admin]
      description: GET /api/v1/admin/metrics is an alias of this route. GMV sums paid non-sandbox orders.
      responses:
        '200':
          description: Metrics bundle
          content:
            application/json:
              schema:
                type: object
                required: [success, brand, metrics]
                properties:
                  success:
                    type: boolean
                  brand:
                    type: string
                  metrics:
                    type: object
                    properties:
                      total_products:
                        type: integer
                      total_orders:
                        type: integer
                      total_gmv_amount:
                        type: integer
                      total_partners:
                        type: integer
                      total_users:
                        type: integer
                      out_of_stock_skus:
                        type: integer
                      open_claims:
                        type: integer
                      pending_settlements_count:
                        type: integer
                      pending_settlements_amount:
                        type: integer
                  waiting:
                    type: object
                    description: '2-9: partner_applications, product_reviews, disputes, payout_requests, fds_reviews.'
        '401':
          description: Missing or expired JWT, or not an ADMIN session

  /api/v1/admin/reviews:
    get:
      summary: List product reviews for moderation (paged)
      description: '2-9: page/per_page, from/to, format=csv replace the fixed 100.'
      tags: [Admin]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 50
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            description: csv returns a text/csv download.
      responses:
        '200':
          description: Reviews with product title and reviewer email
          content:
            application/json:
              schema:
                type: object
                required: [success, brand, count, data]
                properties:
                  success:
                    type: boolean
                  brand:
                    type: string
                  count:
                    type: integer
                  pagination:
                    $ref: '../schemas/common.yaml#/components/schemas/OffsetPageMeta'
                  data:
                    type: array
                    items:
                      type: object
        '401':
          description: Missing or expired JWT, or not an ADMIN session

  /api/v1/admin/reviews/{id}:
    delete:
      summary: Delete a product review (audited)
      tags: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Review deleted
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Missing or expired JWT, or not an ADMIN session
        '404':
          description: Review not found

  /api/v1/admin/users:
    get:
      summary: List users with order counts (paged, PII view logged)
      tags: [Admin]
      description: >
        With ?q=, narrows to id-exact or email-prefix matches for
        operator pickers; LIKE metacharacters in q are escaped.
        2-9: page/per_page, from/to, format=csv replace the fixed 100.
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Optional id or email prefix filter (max 100 chars).
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 50
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            description: csv returns a text/csv download.
      responses:
        '200':
          description: User rows with order_count
          content:
            application/json:
              schema:
                type: object
                required: [success, brand, count, data]
                properties:
                  success:
                    type: boolean
                  brand:
                    type: string
                  count:
                    type: integer
                  pagination:
                    $ref: '../schemas/common.yaml#/components/schemas/OffsetPageMeta'
                  data:
                    type: array
                    items:
                      type: object
        '401':
          description: Missing or expired JWT, or not an ADMIN session

  /api/v1/admin/privacy/access-log:
    get:
      summary: Query PII access log (who viewed, exported or destroyed personal data)
      tags: [Admin]
      description: '2-9: page/per_page, from/to, format=csv replace the fixed 500.'
      parameters:
        - name: actor_user_id
          in: query
          schema:
            type: string
        - name: subject_id
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 50
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            description: csv returns a text/csv download.
      responses:
        '200':
          description: Access-log rows with parsed subject_ids
          content:
            application/json:
              schema:
                type: object
                required: [success, count, data]
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  pagination:
                    $ref: '../schemas/common.yaml#/components/schemas/OffsetPageMeta'
                  data:
                    type: array
                    items:
                      type: object
        '401':
          description: Missing or expired JWT, or not an ADMIN session

  /api/v1/admin/audit-log:
    get:
      summary: Query the operator audit trail (admin_audit_log, newest first)
      tags: [Admin]
      description: >
        P1-A13: filtered read access to the append-only operator audit log.
        Requires the privacy.audit permission (SUPER_ADMIN, PRIVACY_OFFICER).
      parameters:
        - name: actor_user_id
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: target_type
          in: query
          schema:
            type: string
        - name: target_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Audit rows with id, actor_user_id, actor_role, action, target_type, target_id, before_json, after_json, ip, created_at
          content:
            application/json:
              schema:
                type: object
                required: [success, count, data]
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
        '401':
          description: Missing or expired JWT, or not an ADMIN session
        '403':
          description: ADMIN_PERMISSION_DENIED without the privacy.audit permission

  /api/v1/admin/partners:
    get:
      summary: List partners with owner contact and product counts (PII view logged)
      tags: [Admin]
      responses:
        '200':
          description: Partner rows with email, full_name, phone and product_count
          content:
            application/json:
              schema:
                type: object
                required: [success, brand, count, data]
                properties:
                  success:
                    type: boolean
                  brand:
                    type: string
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
        '401':
          description: Missing or expired JWT, or not an ADMIN session

  /api/v1/admin/partners/{id}:
    get:
      summary: Seller detail with account request, penalties, grade and stats
      tags: [Admin]
      description: 4-13 seller screen payload (bank numbers masked).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Partner, payout change, penalties, grade, stats, category rates
        '401':
          description: Missing or expired JWT, or not an ADMIN session
        '404':
          description: Unknown partner id

  /api/v1/admin/partners/{id}/commission:
    put:
      summary: Update a seller base commission rate (audited)
      tags: [Admin]
      description: 4-13 commission_rate 0-50; category overrides stay global.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commission_rate]
              properties:
                commission_rate:
                  type: number
      responses:
        '200':
          description: Updated base rate
        '400':
          description: Rate out of range
        '401':
          description: Missing or expired JWT, or not an ADMIN session
        '404':
          description: Unknown partner id

  /api/v1/admin/ship-badges/sellers:
    get:
      summary: Per-seller dispatch-badge board (cutoff, 30d rate, current badge)
      tags: [Admin]
      description: 'Ship badges: badge_now mirrors the catalog today/tomorrow filters (same KST clock, same 30d rate, same policies). partners.read.'
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Business-name or partner-id substring.
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Sellers with today_cutoff, shipped_30d, same_day_rate_bps, badge_now (TODAY/TOMORROW/NONE) and badge_reason
        '401':
          description: Missing or expired JWT, or not an ADMIN session
        '403':
          description: Lacks partners.read

  /api/v1/admin/partners/{id}/shipping-cutoff:
    put:
      summary: Set a seller today-shipment cutoff on its default ACTIVE template (audited)
      tags: [Admin]
      description: 'Ship badges: POST accepted as an alias of PUT. Null clears. Never invents a template: sellers without an ACTIVE template 404. partners.manage.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                today_cutoff:
                  type: string
                  nullable: true
                  description: HH:MM KST, or null to clear
      responses:
        '200':
          description: Updated cutoff echoed with partner and template ids
        '400':
          description: Malformed cutoff (INVALID_CUTOFF)
        '401':
          description: Missing or expired JWT, or not an ADMIN session
        '403':
          description: Lacks partners.manage
        '404':
          description: Unknown partner (PARTNER_NOT_FOUND) or no ACTIVE template (NO_ACTIVE_TEMPLATE)

  /api/v1/admin/products:
    get:
      summary: List all products with partner, category, SKU and stock rollups (paged)
      tags: [Admin]
      description: '2-9: page/per_page, from/to, format=csv replace the fixed 150.'
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 50
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            description: csv returns a text/csv download.
        - name: shipping
          in: query
          schema:
            type: string
            enum: [assigned, unassigned]
            description: '6-11: filter by seller-policy assignment.'
        - name: identifiers
          in: query
          schema:
            type: string
            enum: [missing, complete, conflict]
            description: '6-12: filter by identifier completion or barcode conflicts.'
      responses:
        '200':
          description: Product rows with business_name, category_name, sku_count and total_stock
          content:
            application/json:
              schema:
                type: object
                required: [success, brand, count, data]
                properties:
                  success:
                    type: boolean
                  brand:
                    type: string
                  count:
                    type: integer
                  pagination:
                    $ref: '../schemas/common.yaml#/components/schemas/OffsetPageMeta'
                  data:
                    type: array
                    items:
                      type: object
        '401':
          description: Missing or expired JWT, or not an ADMIN session

  /api/v1/admin/products/{id}/status:
    put:
      summary: Set product sales status (audited)
      tags: [Admin]
      description: PATCH is accepted as an alias of this route. Clients use PUT.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ACTIVE, HIDDEN, DELETED]
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                type: object
                required: [success, brand, product_id, status]
                properties:
                  success:
                    type: boolean
                  brand:
                    type: string
                  product_id:
                    type: string
                  status:
                    type: string
        '400':
          description: INVALID_STATUS when status is not ACTIVE, HIDDEN or DELETED
        '401':
          description: Missing or expired JWT, or not an ADMIN session
        '404':
          description: Product not found
        '409':
          description: REVIEW_REQUIRED when activating an unapproved product

  /api/v1/admin/products/{id}/review:
    post:
      summary: Approve or reject a product listing review (audited)
      tags: [Admin]
      description: PUT is accepted as an alias of this route. Clients use POST. APPROVE sets review_status APPROVED and status ACTIVE; REJECT sets REJECTED and DRAFT. 6-11: APPROVE requires a usable seller shipping policy (409 SHIPPING_POLICY_REQUIRED otherwise).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [APPROVE, REJECT]
                note:
                  type: string
                  maxLength: 500
                  description: Required when decision is REJECT.
      responses:
        '200':
          description: Review decision applied
          content:
            application/json:
              schema:
                type: object
                required: [success, product_id, review_status, status]
                properties:
                  success:
                    type: boolean
                  product_id:
                    type: string
                  review_status:
                    type: string
                  status:
                    type: string
        '400':
          description: INVALID_DECISION or REASON_REQUIRED when a REJECT has no note
        '401':
          description: Missing or expired JWT, or not an ADMIN session
        '404':
          description: Product not found
        '409':
          description: SHIPPING_POLICY_REQUIRED when approving a policy-less product

  /api/v1/admin/products/review-queue:
    get:
      summary: Pending products with auto-check flags for reviewers
      tags: [Admin]
      description: 4-14 images/notice/banned-word/exaggeration/price-hike checks per row; rulings stay human.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Queued products with checks and pagination
        '401':
          description: Missing or expired JWT, or not an ADMIN session

  /api/v1/admin/partners/{id}/payout-account:
    post:
      summary: Verify a payout account or rule on a pending account-change request (audited)
      tags: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  description: VERIFY_CURRENT, APPROVE, or anything else to reject the pending change.
                verification_evidence:
                  type: string
                  maxLength: 300
                  description: Real-name verification evidence; required for VERIFY_CURRENT and APPROVE.
      responses:
        '200':
          description: Decision applied (payout_account_verified or applied flag)
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                  payout_account_verified:
                    type: boolean
                  applied:
                    type: boolean
        '400':
          description: EVIDENCE_REQUIRED when verification evidence is missing
        '401':
          description: Missing or expired JWT, or not an ADMIN session
        '404':
          description: Partner not found
        '409':
          description: NO_PENDING_CHANGE when no account-change request is waiting

  /api/v1/admin/orders:
    get:
      summary: List orders with sub-orders and items (latest 50, PII view logged)
      tags: [Admin]
      description: '4-16: status, from/to, q (order/member/seller/product), page/per_page, format=csv.'
      responses:
        '200':
          description: Order rows with buyer_email and nested sub_orders
          content:
            application/json:
