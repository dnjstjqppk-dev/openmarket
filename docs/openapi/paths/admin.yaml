      summary: List users with order counts (latest 100, PII view logged)
      tags: [Admin]
      description: >
        With ?q=, narrows to id-exact or email-prefix matches (limit 20) for
        operator pickers; LIKE metacharacters in q are escaped.
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Optional id or email prefix filter (max 100 chars).
      responses:
        '200':
          description: User rows with order_count
          content:
            application/json:
              schema:
                type: object
                required: [success, brand, count, data]
                properties:
                  success:
                    type: boolean
                  brand:
                    type: string
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
        '401':
          description: Missing or expired JWT, or not an ADMIN session

  /api/v1/admin/privacy/access-log:
    get:
      summary: Query PII access log (who viewed, exported or destroyed personal data)
      tags: [Admin]
      parameters:
        - name: actor_user_id
          in: query
          schema:
            type: string
        - name: subject_id
          in: query
          schema:
            type: string
        - name: action
          in: query
