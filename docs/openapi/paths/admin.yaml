          content:
            application/json:
              schema:
                type: object
                required: [success, count, data]
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
        '401':
          description: Missing or expired JWT, or not an ADMIN session

  /api/v1/admin/claims/{id}:
    put:
      summary: Rule on a REQUESTED claim — refund via the refund engine, price-adjust grant, or reject (audited)
      tags: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision:
                  type: string
                  description: APPROVE to refund, REJECT (or REJECTED) to decline; status is accepted as an alias.
                status:
                  type: string
                notes:
                  type: string
                  maxLength: 500
                  description: Required when rejecting.
                restock:
                  type: boolean
                  description: Defaults to true; returnless approvals skip restock.
                returnless:
                  type: boolean
      responses:
        '200':
          description: Claim ruled (REJECTED; RETURN yields REFUNDED with refund object; PRICE_ADJUSTMENT yields REFUNDED with granted credit capped at 10% of paid max 10000원, charged to seller settlements)
          content:
            application/json:
              schema:
                type: object
                required: [success, claim_id, status]
                properties:
                  success:
                    type: boolean
                  claim_id:
                    type: string
                  status:
                    type: string
                  refund:
                    type: object
        '401':
          description: Missing or expired JWT, or not an ADMIN session
        '403':
          description: Refund approval needs the orders.refund permission
        '404':
          description: Claim not found
        '409':
          description: CLAIM_ALREADY_PROCESSED, or UNSUPPORTED for non-RETURN refund approvals

