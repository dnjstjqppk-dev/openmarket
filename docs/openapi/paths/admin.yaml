                  success:
                    type: boolean
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
        '401':
          description: Missing or expired JWT, or not an ADMIN session

  /api/v1/admin/audit-log:
    get:
      summary: Query the operator audit trail (admin_audit_log, newest first)
      tags: [Admin]
      description: >
        P1-A13: filtered read access to the append-only operator audit log.
        Requires the privacy.audit permission (SUPER_ADMIN, PRIVACY_OFFICER).
      parameters:
        - name: actor_user_id
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: target_type
          in: query
          schema:
            type: string
        - name: target_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        '200':
          description: Audit rows with id, actor_user_id, actor_role, action, target_type, target_id, before_json, after_json, ip, created_at
          content:
            application/json:
              schema:
                type: object
                required: [success, count, data]
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
        '401':
          description: Missing or expired JWT, or not an ADMIN session
        '403':
          description: ADMIN_PERMISSION_DENIED without the privacy.audit permission

  /api/v1/admin/partners:
    get:
      summary: List partners with owner contact and product counts (PII view logged)
      tags: [Admin]
      responses:
        '200':
          description: Partner rows with email, full_name, phone and product_count
          content:
            application/json:
              schema:
                type: object
                required: [success, brand, count, data]
                properties:
                  success:
                    type: boolean
                  brand:
                    type: string
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
        '401':
          description: Missing or expired JWT, or not an ADMIN session

  /api/v1/admin/products:
    get:
      summary: List all products with partner, category, SKU and stock rollups (latest 150)
      tags: [Admin]
      responses:
        '200':
          description: Product rows with business_name, category_name, sku_count and total_stock
          content:
            application/json:
              schema:
                type: object
                required: [success, brand, count, data]
                properties:
                  success:
                    type: boolean
                  brand:
                    type: string
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
        '401':
          description: Missing or expired JWT, or not an ADMIN session

  /api/v1/admin/products/{id}/status:
    put:
      summary: Set product sales status (audited)
      tags: [Admin]
      description: PATCH is accepted as an alias of this route. Clients use PUT.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ACTIVE, HIDDEN, DELETED]
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                type: object
                required: [success, brand, product_id, status]
                properties:
                  success:
                    type: boolean
                  brand:
                    type: string
                  product_id:
                    type: string
                  status:
                    type: string
        '400':
          description: INVALID_STATUS when status is not ACTIVE, HIDDEN or DELETED
        '401':
          description: Missing or expired JWT, or not an ADMIN session
        '404':
          description: Product not found
        '409':
          description: REVIEW_REQUIRED when activating an unapproved product

  /api/v1/admin/products/{id}/review:
    post:
      summary: Approve or reject a product listing review (audited)
      tags: [Admin]
      description: PUT is accepted as an alias of this route. Clients use POST. APPROVE sets review_status APPROVED and status ACTIVE; REJECT sets REJECTED and DRAFT.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [APPROVE, REJECT]
                note:
                  type: string
                  maxLength: 500
                  description: Required when decision is REJECT.
      responses:
        '200':
          description: Review decision applied
          content:
            application/json:
              schema:
                type: object
                required: [success, product_id, review_status, status]
                properties:
                  success:
                    type: boolean
                  product_id:
                    type: string
                  review_status:
                    type: string
                  status:
                    type: string
        '400':
          description: INVALID_DECISION or REASON_REQUIRED when a REJECT has no note
        '401':
          description: Missing or expired JWT, or not an ADMIN session
        '404':
          description: Product not found

  /api/v1/admin/partners/{id}/payout-account:
    post:
      summary: Verify a payout account or rule on a pending account-change request (audited)
      tags: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  description: VERIFY_CURRENT, APPROVE, or anything else to reject the pending change.
                verification_evidence:
                  type: string
                  maxLength: 300
                  description: Real-name verification evidence; required for VERIFY_CURRENT and APPROVE.
      responses:
        '200':
          description: Decision applied (payout_account_verified or applied flag)
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                  payout_account_verified:
                    type: boolean
                  applied:
                    type: boolean
        '400':
          description: EVIDENCE_REQUIRED when verification evidence is missing
        '401':
          description: Missing or expired JWT, or not an ADMIN session
        '404':
          description: Partner not found
        '409':
          description: NO_PENDING_CHANGE when no account-change request is waiting

