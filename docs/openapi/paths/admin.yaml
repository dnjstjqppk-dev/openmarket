  /api/v1/admin/legal-documents:
    get:
      summary: List legal documents with per-kind status (SUPER_ADMIN only)
      tags: [Admin]
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [TERMS, PRIVACY, REFUND]
          description: Filter to one kind.
      responses:
        '200':
          description: Documents with status CURRENT/UPCOMING/SUPERSEDED and full bodies for preview
        '401':
          description: Missing or expired JWT
        '403':
          description: Non-SUPER_ADMIN role (ADMIN_PERMISSION_DENIED)
    post:
      summary: Register a new legal document version (SUPER_ADMIN only)
      tags: [Admin]
      description: >
        The effective date is a KST calendar day and cannot be before today
        (RETROACTIVE_EFFECTIVE_DATE). Versions are unique per kind and immutable
        once registered; the write is audited as LEGAL_DOCUMENT_CREATE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, version, effective_date, body]
              properties:
                kind:
                  type: string
                  enum: [TERMS, PRIVACY, REFUND]
                version:
                  type: string
                  maxLength: 20
                  example: v1.2
                effective_date:
                  type: string
                  description: KST day YYYY-MM-DD, today or later.
                body:
                  type: string
                  maxLength: 100000
                  description: Sections ('# '), bullets ('- '), paragraphs; **bold** inline.
      responses:
        '201':
          description: Registered document row
        '400':
          description: Bad kind/date/body or retroactive date (INVALID_LEGAL_KIND/INVALID_DATE/BODY_REQUIRED/RETROACTIVE_EFFECTIVE_DATE)
        '401':
          description: Missing or expired JWT
        '403':
          description: Non-SUPER_ADMIN role (ADMIN_PERMISSION_DENIED)
        '409':
          description: Version already registered for the kind (VERSION_EXISTS)
