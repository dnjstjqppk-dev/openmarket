      responses:
        '200':
          description: Metrics bundle
          content:
            application/json:
              schema:
                type: object
                required: [success, brand, metrics]
                properties:
                  success:
                    type: boolean
                  brand:
                    type: string
                  metrics:
                    type: object
                    properties:
                      total_products:
                        type: integer
                      total_orders:
                        type: integer
                      total_gmv_amount:
                        type: integer
                      total_partners:
                        type: integer
                      total_users:
                        type: integer
                      out_of_stock_skus:
                        type: integer
                      open_claims:
                        type: integer
                      pending_settlements_count:
                        type: integer
                      pending_settlements_amount:
                        type: integer
        '401':
          description: Missing or expired JWT, or not an ADMIN session

  /api/v1/admin/reviews:
    get:
      summary: List product reviews for moderation (latest 100)
      tags: [Admin]
      responses:
        '200':
          description: Reviews with product title and reviewer email
          content:
            application/json:
              schema:
                type: object
                required: [success, brand, count, data]
