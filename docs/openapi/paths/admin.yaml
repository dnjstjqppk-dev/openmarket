paths:
  /api/v1/admin/partners/{id}/verify:
    patch:
      summary: Approve or reject partner onboarding verification
      tags: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, commission_rate]
              properties:
                status:
                  type: string
                  enum: [APPROVED, REJECTED, SUSPENDED]
                commission_rate:
                  type: number
                  format: double
                  minimum: 0.0
                  maximum: 50.0
                reject_reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Partner status updated
          content:
            application/json:
              schema:
                type: object
                required: [partner_id, status, updated_at]
                properties:
                  partner_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                  updated_at:
                    type: string
                    format: date-time

  /api/v1/admin/sdui/layouts:
    put:
      summary: Publish new Server-Driven UI home layout for Web and Mobile
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_platform, blocks]
              properties:
                target_platform:
                  type: string
                  enum: [WEB, MOBILE, ALL]
                blocks:
                  type: array
                  minItems: 1
                  items:
                    $ref: '../schemas/common.yaml#/components/schemas/SduiBlock'
      responses:
        '200':
          description: Layout published
          content:
            application/json:
              schema:
                type: object
                required: [layout_id, version]
                properties:
                  layout_id:
                    type: string
                    format: uuid
                  version:
                    type: integer

  /api/v1/admin/settlements/execute:
    post:
      summary: Execute escrow release and double-entry ledger settlement for confirmed orders
      tags: [Admin]
      parameters:
        - $ref: '../schemas/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [period_start, period_end]
              properties:
                period_start:
                  type: string
                  format: date
                period_end:
                  type: string
                  format: date
      responses:
        '200':
          description: Settlement batch executed
          content:
            application/json:
              schema:
                type: object
                required: [processed_partners_count, total_payout_amount]
                properties:
                  processed_partners_count:
                    type: integer
                  total_payout_amount:
                    type: integer
                    format: int64

