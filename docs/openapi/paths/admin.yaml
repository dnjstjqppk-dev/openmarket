  /api/v1/admin/settlements/{id}/approve:
    post:
      summary: Approve a single settlement payout (retired)
      tags: [Admin]
      deprecated: true
      description: Retired. Create seller-level payouts via POST /api/v1/admin/finance/payouts instead.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '410':
          description: USE_PAYOUT_ENGINE — per-settlement approval was removed
        '401':
          description: Missing or expired JWT, or not an ADMIN session

  /api/v1/admin/claims:
