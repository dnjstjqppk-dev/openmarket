  /api/v1/admin/admin-users:
    get:
      summary: List operator accounts with MFA state (SUPER_ADMIN only)
      tags: [Admin]
      responses:
        '200':
          description: Operator rows with mfa_enabled
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
        '401':
          description: Missing or expired JWT, or not an ADMIN session
        '403':
          description: Requires the admin.manage permission (SUPER_ADMIN)
    post:
      summary: Create an operator account with a role (SUPER_ADMIN only, audited)
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, admin_role, password, full_name]
              properties:
                email:
                  type: string
                  maxLength: 254
                admin_role:
                  type: string
                  enum: [SUPER_ADMIN, FINANCE, OPERATIONS, CS, PRIVACY_OFFICER]
                password:
                  type: string
                  description: Must pass the account password policy.
                full_name:
                  type: string
                  maxLength: 50
                phone:
                  type: string
                  maxLength: 20
      responses:
        '201':
          description: Operator created (2FA setup required at first login)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '400':
          description: INVALID_EMAIL, INVALID_ADMIN_ROLE or a password-policy violation
        '401':
          description: Missing or expired JWT, or not an ADMIN session
        '403':
          description: Requires the admin.manage permission (SUPER_ADMIN)
        '409':
          description: EMAIL_TAKEN

  /api/v1/admin/admin-users/{id}:
    put:
      summary: Change an operator role, active state or reset 2FA (SUPER_ADMIN only, audited)
      tags: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                admin_role:
                  type: string
                  enum: [SUPER_ADMIN, FINANCE, OPERATIONS, CS, PRIVACY_OFFICER]
                is_active:
                  type: boolean
                reset_2fa:
                  type: boolean
                  description: Clears TOTP secrets and recovery codes when true.
      responses:
        '200':
          description: Operator updated (sessions revoked) or unchanged
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '400':
          description: INVALID_ADMIN_ROLE
        '401':
          description: Missing or expired JWT, or not an ADMIN session
        '403':
          description: Requires the admin.manage permission (SUPER_ADMIN)
        '404':
          description: Operator account not found
        '409':
          description: SELF_LOCKOUT or LAST_SUPER_ADMIN

  /api/v1/admin/inquiries:
    get:
      summary: NEW-09. List customer 1:1 inquiries (paginated, filterable by status)
      tags: [Admin]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, ANSWERED, CLOSED]
        - name: page
          in: query
          schema:
            type: integer
        - name: per_page
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Newest-first inquiries with customer email and pagination
          content:
            application/json:
              schema:
                type: object
                required: [success, count, pagination, data]
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  pagination:
                    type: object
                  data:
                    type: array
                    items:
                      type: object
        '401':
          description: Missing or expired JWT
        '403':
          description: Requires the orders.read permission

  /api/v1/admin/inquiries/{id}/reply:
    post:
      summary: NEW-09. Register an operator answer on a customer inquiry
      tags: [Admin]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer:
                  type: string
                  maxLength: 10000
                close:
                  type: boolean
                  description: Mark the inquiry CLOSED together with the answer.
      responses:
        '200':
          description: Answer registered (status ANSWERED, or CLOSED with close=true)
          content:
            application/json:
              schema:
                type: object
                required: [success, inquiry_id, status]
                properties:
                  success:
                    type: boolean
                  inquiry_id:
                    type: string
                  status:
                    type: string
                    enum: [ANSWERED, CLOSED]
        '400':
          description: Missing answer
        '401':
          description: Missing or expired JWT
        '403':
          description: Requires the orders.manage permission
        '404':
          description: Unknown inquiry id
        '409':
          description: INQUIRY_CLOSED when the inquiry is already closed
