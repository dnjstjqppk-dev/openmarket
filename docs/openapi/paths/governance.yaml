# Governance paths (control tower, FDS, disputes).
# Verified against the gateway implementation (routes/global-governance.js)
# in the P0-11 Wave 2 sweep (2026-11-10); FDS enforcement paths added in
# Wave E (2026-11-11). Every path below is covered by
# tests/openapi_reconciliation_test.mjs.
paths:
  /api/v1/admin/control-tower:
    get:
      summary: Central operations control-tower overview (admin)
      tags: [Governance]
      responses:
        '200':
          description: GMV, orders, escrow, disputes and system health snapshot
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  brand:
                    type: string
                  data:
                    type: object
                    required: [total_gmv_krw, total_orders, system_health, timestamp]
                    properties:
                      total_gmv_krw:
                        type: number
                      total_orders:
                        type: integer
                      cross_border_pccc_orders:
                        type: integer
                      escrow_protected_balance_krw:
                        type: number
                      pending_settlement_count:
                        type: integer
                      open_disputes_count:
                        type: integer
                      customs_bottleneck_alerts:
                        type: integer
                      regional_nodes:
                        type: array
                        items:
                          type: object
                      edge_regions:
                        type: array
                        items:
                          type: object
                      system_health:
                        type: object
                        description: d1_database, customs_unipass_api, global_fx_synchronizer, fds_engine.
                      timestamp:
                        type: string
                        format: date-time
        '401':
          description: Missing or expired JWT, or not an admin

  /api/v1/admin/fds/overview:
    get:
      summary: Fraud-detection-system status and active rules (admin)
      tags: [Governance]
      description: >
        All counts are measured: blocks from the audit trail (FDS_BLOCK),
        reviews from orders.fds_decision. Since Wave E checkout evaluates
        every order (status ENFORCED_AT_CHECKOUT).
      responses:
        '200':
          description: FDS status with measured 24h counts and the active rule table
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  brand:
                    type: string
                  data:
                    type: object
                    required: [status, blocked_attempts_24h, reviews_24h, open_reviews, active_rules]
                    properties:
                      status:
                        type: string
                        enum: [ENFORCED_AT_CHECKOUT]
                      blocked_attempts_24h:
                        type: integer
                      reviews_24h:
                        type: integer
                      open_reviews:
                        type: integer
                      active_rules:
                        type: array
                        items:
                          type: object
                          description: id, code, name, severity, status, hit_count_24h, enforcement.
        '401':
          description: Missing or expired JWT, or not an admin

  /api/v1/admin/fds/evaluate:
    post:
      summary: Manually probe transaction risk against FDS rules (admin)
      tags: [Governance]
      description: >
        An estimate from caller-supplied signals. Checkout itself evaluates
        with live database signals (services/fds.js), so the probe can differ
        from a real verdict. Thresholds follow FDS_BLOCK_SCORE /
        FDS_REVIEW_SCORE / FDS_HIGH_VALUE_KRW (defaults 85 / 40 / 1500000).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount_krw:
                  type: number
                ip_country:
                  type: string
                  default: KR
                shipping_country:
                  type: string
                  default: KR
                failed_attempts_10m:
                  type: number
      responses:
        '200':
          description: Risk score with BLOCK / REVIEW / ALLOW decision
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  brand:
                    type: string
                  data:
                    type: object
                    required: [risk_score, decision, triggered_rules, evaluated_at]
                    properties:
                      risk_score:
                        type: integer
                      decision:
                        type: string
                        enum: [BLOCK, REVIEW, ALLOW]
                      triggered_rules:
                        type: array
                        items:
                          type: string
                      evaluated_at:
                        type: string
                        format: date-time
        '401':
          description: Missing or expired JWT, or not an admin

  /api/v1/admin/fds/reviews:
    get:
      summary: List orders held for FDS review (admin)
      tags: [Governance]
      description: >
        Orders with fds_decision REVIEW, newest first (limit 200). Reading the
        queue writes a pii_access_log VIEW row (buyer_email is exposed).
      responses:
        '200':
          description: Review queue with per-order scores and triggered rules
          content:
            application/json:
              schema:
                type: object
                required: [success, count, data]
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
        '401':
          description: Missing or expired JWT, or not an admin

  /api/v1/admin/fds/reviews/{id}/clear:
    post:
      summary: Clear an FDS review and release held settlements (admin)
      tags: [Governance]
      description: >
        Sets fds_decision CLEARED. When the order is already PAID, its HOLD
        settlements move to PENDING in the same batch. Requires a review note;
        the loser of a concurrent resolution race gets 409 NOT_IN_REVIEW.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Order id or order_no in REVIEW state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Review cleared
        '401':
          description: Missing or expired JWT, or not an admin
        '404':
          description: Unknown order id
        '409':
          description: NOT_IN_REVIEW when the order is not awaiting review

  /api/v1/admin/fds/reviews/{id}/fraud:
    post:
      summary: Confirm an FDS review as fraud (admin)
      tags: [Governance]
      description: >
        Sets fds_decision FRAUD. Settlements stay HOLD; account suspension and
        refunds follow the existing operator procedures.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Order id or order_no in REVIEW state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Review confirmed as fraud
        '401':
          description: Missing or expired JWT, or not an admin
        '404':
          description: Unknown order id
        '409':
          description: NOT_IN_REVIEW when the order is not awaiting review

  /api/v1/admin/fds/prohibited-hs:
    get:
      summary: List prohibited HS codes (admin)
      tags: [Governance]
      responses:
        '200':
          description: Blocklist rows ordered by code
        '401':
          description: Missing or expired JWT, or not an admin
    post:
      summary: Add an HS code to the prohibited blocklist (admin)
      tags: [Governance]
      description: >
        Feeds RULE_05 (PROHIBITED_HS_SCANNER): checkout blocks any line whose
        HS code equals or starts with a listed code (digits compared).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, reason]
              properties:
                code:
                  type: string
                  maxLength: 20
                  description: HS code, at least 2 digits (dots allowed).
                reason:
                  type: string
                  maxLength: 300
      responses:
        '201':
          description: Code blocklisted
        '400':
          description: INVALID_HS_CODE when fewer than 2 digits remain
        '401':
          description: Missing or expired JWT, or not an admin
        '409':
          description: ALREADY_BLOCKED when the code is already listed

  /api/v1/admin/fds/prohibited-hs/{id}:
    delete:
      summary: Remove an HS code from the prohibited blocklist (admin)
      tags: [Governance]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Blocklisted HS code.
      responses:
        '200':
          description: Code removed
        '401':
          description: Missing or expired JWT, or not an admin
        '404':
          description: Code not on the blocklist

  /api/v1/admin/disputes:
    get:
      summary: List 3-party disputes for the arbitration tribunal (admin)
      tags: [Governance]
      responses:
        '200':
          description: Latest 50 returns joined with order fields
          content:
            application/json:
              schema:
                type: object
                required: [success, count, data]
                properties:
                  success:
                    type: boolean
                  brand:
                    type: string
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
        '401':
          description: Missing or expired JWT, or not an admin

  /api/v1/admin/disputes/{id}/arbitrate:
    post:
      summary: Arbitrate a dispute (retired; use the claim engine)
      tags: [Governance]
      deprecated: true
      description: Always returns 410 USE_CLAIM_ENGINE. Rulings go through PUT /api/v1/admin/claims/:id with decision APPROVE or REJECT, which executes the real refund.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '410':
          description: USE_CLAIM_ENGINE with a pointer to PUT /api/v1/admin/claims/:id
        '401':
          description: Missing or expired JWT, or not an admin
