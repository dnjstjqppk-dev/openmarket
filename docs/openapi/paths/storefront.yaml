# Storefront paths. Verified against the gateway implementation
# (apps/cloudflare-gateway/src/routes/catalog.js, orders.js, features.js,
# services/orders.js). Retired 2026-11-07: GET /api/v1/home/sdui and
# GET /api/v1/flash-sales/stream never had a gateway route behind them
# (no handler, no client usage); the live campaign feed is
# GET /api/v1/campaigns/lightning below.
paths:
  /api/v1/products:
    get:
      summary: Offset-paginated ACTIVE product feed with catalog joins
      tags: [Storefront]
      security: []
      parameters:
        - name: category
          in: query
          schema:
            type: string
          description: Category slug or id ('all' disables the filter). Matches the category and its direct children. 3-2: comma multi-select (max 20).
        - name: partner_id
          in: query
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [popular, price_asc, price_desc, newest, rating, reviews, relevance]
            default: popular
          description: Keyword searches (q) default to relevance (FTS bm25, then units sold); without q the default is popular.
        - name: q
          in: query
          schema:
            type: string
          description: Title/description/category LIKE search (alias: search). A search_synonyms row rewrites the fourth match arm.
        - name: min_price
          in: query
          schema:
            type: integer
            minimum: 0
        - name: max_price
          in: query
          schema:
            type: integer
            minimum: 0
        - name: brand
          in: query
          schema:
            type: string
          description: '2-9: comma-separated brands, max 10 (BRAND_FILTER_LIMIT over).'
        - name: free_shipping
          in: query
          schema:
            type: string
          description: '2-9: true/1 keeps only free-shipping sellers (zero base fee or an ACTIVE FREE template).'
        - name: coupon_eligible
          in: query
          schema:
            type: string
          description: '2-9: true/1 keeps only products with a live claimable coupon in scope.'
        - name: sales_model
          in: query
          schema:
            type: string
          description: '2-9: seller type; anything else is 400 INVALID_SALES_MODEL. 3-2: comma multi (both = unfiltered).'
        - name: min_rating
          in: query
          schema:
            type: number
          description: '2-9: minimum stored average rating 0..5 (400 outside).'
        - name: today_shipment
          in: query
          schema:
            type: string
          description: '2-9: true/1 keeps only sellers with an ACTIVE template carrying today_cutoff.'
        - name: exhibition_id
          in: query
          schema:
            type: string
          description: '2-9: keeps only products in the given live exhibition (alias: exhibition).'
        - name: has_discount
          in: query
          schema:
            type: string
          description: '3-2: true/1 keeps only rows priced below original.'
        - name: exclude_overseas
          in: query
          schema:
            type: string
          description: '3-2: true/1 keeps only KR-fulfilling sellers (partners.country_code).'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Invalid values fall back to 1, never 500.
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
          description: Legacy alias 'limit' is accepted. Clamped to 1..200.
      responses:
        '200':
          description: Product rows with brand, category and rating joins
          content:
            application/json:
              schema:
                type: object
                required: [success, count, filters, pagination, data]
                properties:
                  success:
                    type: boolean
                  brand:
                    type: string
                  count:
                    type: integer
                  filters:
                    type: object
                    properties:
                      category:
                        type: string
                        nullable: true
                      partner_id:
                        type: string
                        nullable: true
                      sort:
                        type: string
                      search:
                        type: string
                        nullable: true
                  pagination:
                    $ref: '../schemas/common.yaml#/components/schemas/OffsetPageMeta'
                  data:
                    type: array
                    items:
                      $ref: '../schemas/common.yaml#/components/schemas/ProductSummary'

  /api/v1/products/{id}:
    get:
      summary: Product detail with SKUs, option attributes and buy-box summary
      tags: [Storefront]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Opaque product id (prod_*), not a UUID.
      responses:
        '200':
          description: Product row with SKUs and merchandising blocks
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  brand:
                    type: string
                  data:
                    type: object
                    required: [id, title, skus, attributes, buy_box, volume_discounts]
                    properties:
                      id:
                        type: string
                      title:
                        type: string
                      video_url:
                        type: string
                        nullable: true
                        description: Only a video the seller actually registered, else null.
                      quality_score:
                        type: integer
                        minimum: 0
                        maximum: 100
                      avg_rating:
                        type: number
                        nullable: true
                      review_count:
                        type: integer
                      qna_count:
                        type: integer
                      skus:
                        type: array
                        items:
                          allOf:
                            - $ref: '../schemas/common.yaml#/components/schemas/SkuItem'
                            - type: object
                              properties:
                                option_values_json:
                                  type: string
                                options:
                                  type: object
                      attributes:
                        type: array
                        items:
                          type: object
                          required: [name, values]
                          properties:
                            name:
                              type: string
                            values:
                              type: array
                              items:
                                type: string
                      buy_box:
                        type: object
                        description: Single-supplier direct offer summary.
                      volume_discounts:
                        type: array
                        items:
                          type: object
                          required: [min_quantity, discount_rate_pct, label]
                          properties:
                            min_quantity:
                              type: integer
                            discount_rate_pct:
                              type: integer
                            label:
                              type: string
                      images:
                        type: array
                        description: Gallery rows ordered by sort_order (representative image first).
                        items:
                          type: object
                          required: [id, image_url, sort_order]
                          properties:
                            id:
                              type: string
                            image_url:
                              type: string
                            alt_text:
                              type: string
                            sort_order:
                              type: integer
                            width:
                              type: integer
                              nullable: true
                            height:
                              type: integer
                              nullable: true
                      notice_template:
                        type: object
                        nullable: true
                        description: Product notice template (product ref, else its category ref), else null.
                      notice_values:
                        type: object
                        nullable: true
                        description: Stored per-product notice inputs, else null.
                      shipping_policy:
                        type: object
                        nullable: true
                        description: '2-9: effective shipping template (product ref, else seller default), else null.'
                      seller:
                        type: object
                        description: '2-9: seller summary (grade, rating, followers, inquiry_response_rate).'
                      max_coupon_discount:
                        type: integer
                        nullable: true
                        description: '2-9: best claimable coupon discount over the floor price, else null.'
        '404':
          description: Unknown product id
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'

  /api/v1/orders/checkout:
    post:
      summary: Create a READY order with 30-minute stock/coupon/credit reservation
      tags: [Storefront]
      description: >
        Customer JWT required. POST /api/v1/orders is an alias with the identical
        contract. Server prices from product_skus (client totals are ignored).
        Fails 503 OPERATOR_NOT_CONFIGURED when no operating entity is active, or SCHEMA_MISMATCH when D1 lags the code schema level.
      parameters:
        - $ref: '../schemas/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, recipient_name, recipient_phone, shipping_address_line1, shipping_postal_code]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [sku_id, quantity]
                    properties:
                      sku_id:
                        type: string
                      quantity:
                        type: integer
                        minimum: 1
                        maximum: 999
                      product_id:
                        type: string
                        description: Optional cross-check; SKU_PRODUCT_MISMATCH when it disagrees with the SKU.
                recipient_name:
                  type: string
                  maxLength: 50
                recipient_phone:
                  type: string
                  maxLength: 20
                  description: Must match ^[0-9+\-\s()]{9,20}$.
                shipping_address_line1:
                  type: string
                  maxLength: 200
                shipping_address_line2:
                  type: string
                  maxLength: 200
                shipping_postal_code:
                  type: string
                  description: 5-digit postal code.
                shipping_memo:
                  type: string
                  maxLength: 200
                shipping_address:
                  type: object
                  description: Nested alternative to the flat recipient/address fields.
                pccc:
                  type: string
                  description: Personal customs code, ^P\d{12}$ when present. Format-checked only.
                user_coupon_id:
                  type: string
                coupon_code:
                  type: string
                use_credit_amount:
                  type: integer
                  minimum: 0
                  description: Alias use_credits is accepted. Verified users only (403 CREDIT_UNVERIFIED), 30000원+ goods (409 CREDIT_MIN_ORDER), clamped to 20% of net goods.
                idempotency_key:
                  type: string
                  description: Body fallback for X-Idempotency-Key.
      responses:
        '201':
          description: Order created (200 with idempotent_replay=true on key replay)
          content:
            application/json:
              schema:
                type: object
                required: [success, order_id, order_no, total_pay_amount, data]
                properties:
                  success:
                    type: boolean
                  order_id:
                    type: string
                  order_no:
                    type: string
                  payment_status:
                    type: string
                  status:
                    type: string
                  total_goods_amount:
                    type: integer
                  total_shipping_amount:
                    type: integer
                  volume_discount_amount:
                    type: integer
                  coupon_discount_amount:
                    type: integer
                  credit_used_amount:
                    type: integer
                  total_discount_amount:
                    type: integer
                  total_pay_amount:
                    type: integer
                  payment_expires_at:
                    type: string
                  currency:
                    type: string
                    example: KRW
                  sub_orders_created:
                    type: integer
                  idempotent_replay:
                    type: boolean
                  data:
                    type: object
        '400':
          description: CART_EMPTY, SKU_REQUIRED, INVALID_QUANTITY, INVALID_PHONE, INVALID_POSTAL_CODE, INVALID_PCCC, INVALID_SKU, INVALID_IDEMPOTENCY_KEY
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'
        '403':
          description: CREDIT_UNVERIFIED (email verification required to spend credits)
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'
        '409':
          description: STOCK_INSUFFICIENT, PRODUCT_NOT_ON_SALE, DIRECT_SKU_NOT_SOURCEABLE, CREDIT_MIN_ORDER, CREDIT_INSUFFICIENT
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'
        '503':
          description: OPERATOR_NOT_CONFIGURED or SCHEMA_MISMATCH (D1 lags the code schema level)
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'

  /api/v1/campaigns/lightning:
    get:
      summary: Currently running lightning-deal campaign with real charged prices
      tags: [Storefront]
      security: []
      description: >
        Returns the single campaign whose ACTIVE window contains now, or
        campaign=null with empty items. deal_price always equals the SKU price
        checkout charges; there is no separate deal-price engine.
      responses:
        '200':
          description: Campaign and mapped deals
          content:
            application/json:
              schema:
                type: object
                required: [success, campaign, items, data]
                properties:
                  success:
                    type: boolean
                  campaign:
                    type: object
                    nullable: true
                  items:
                    type: array
                    items:
                      type: object
                      required: [deal_price, sold_quantity, discount_rate, sold_percent, remaining_stock]
                      properties:
                        deal_price:
                          type: integer
                        sold_quantity:
                          type: integer
                        discount_rate:
                          type: integer
                        sold_percent:
                          type: integer
                        remaining_stock:
                          type: integer
                  data:
                    type: object
                    required: [campaign, deals, items]
                    properties:
                      campaign:
                        type: object
                        nullable: true
                      deals:
                        type: array
                        items:
                          type: object
                      items:
                        type: array
                        items:
                          type: object

  /api/v1/categories:
    get:
      summary: Full category tree with bottom-up product counts
      tags: [Storefront]
      security: []
      responses:
        '200':
          description: Active categories sorted by depth then sort_order
          content:
            application/json:
              schema:
                type: object
                required: [success, brand, count, data]
                properties:
                  success:
                    type: boolean
                  brand:
                    type: string
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name, slug, depth, sort_order, product_count]
                      properties:
                        id:
                          type: string
                        parent_id:
                          type: string
                          nullable: true
                        name:
                          type: string
                        slug:
                          type: string
                        depth:
                          type: integer
                        sort_order:
                          type: integer
                        icon_key:
                          type: string
                          nullable: true
                          description: '3-1: operator icon key for shortcut circles (null until set).'
                        product_count:
                          type: integer
                          description: Direct ACTIVE count rolled up bottom-up from descendants.

  /api/v1/categories/{slug}:
    get:
      summary: Category detail with parent and subcategories
      tags: [Storefront]
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          description: Category slug or id (matched against either column).
      responses:
        '200':
          description: Category row plus parent_category and subcategories
          content:
            application/json:
              schema:
                type: object
                required: [success, brand, data]
                properties:
                  success:
                    type: boolean
                  brand:
                    type: string
                  data:
                    type: object
                    required: [id, name, slug, subcategories]
                    properties:
                      id:
                        type: string
                      parent_id:
                        type: string
                        nullable: true
                      name:
                        type: string
                      slug:
                        type: string
                      depth:
                        type: integer
                      sort_order:
                        type: integer
                      parent_category:
                        type: object
                        nullable: true
                        description: Null for root categories.
                      subcategories:
                        type: array
                        items:
                          type: object
        '404':
          description: Category not found

  /api/v1/products/{id}/buy-box:
    get:
      summary: Buy-box evaluation for a single-supplier product
      tags: [Storefront]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Single-supplier direct offer analysis
          content:
            application/json:
              schema:
                type: object
                required: [success, brand, data]
                properties:
                  success:
                    type: boolean
                  brand:
                    type: string
                  data:
                    type: object
                    required: [product_id, evaluated_at, mode, supplier, winner, eligibility]
                    properties:
                      product_id:
                        type: string
                      evaluated_at:
                        type: string
                        format: date-time
                      mode:
                        type: string
                      competitive_offers_count:
                        type: integer
                      supplier:
                        type: object
                      winner:
                        type: object
                      eligibility:
                        type: object
                        properties:
                          is_buy_box_eligible:
                            type: boolean
                          is_lowest_price_guaranteed:
                            type: boolean
                          selection_reason:
                            type: string
        '404':
          description: Product not found

  /api/v1/partners/{id}/store:
    get:
      summary: Public partner mini-shop storefront
      tags: [Storefront]
      security: []
      description: Only APPROVED partners have a public store; pending, rejected and suspended ones return 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Partner profile, shipping policy, stats and ACTIVE products
          content:
            application/json:
              schema:
                type: object
                required: [success, brand, data]
                properties:
                  success:
                    type: boolean
                  brand:
                    type: string
                  data:
                    type: object
                    required: [partner, shipping_policy, stats, metrics, products]
                    properties:
                      partner:
                        type: object
                      shipping_policy:
                        type: object
                        properties:
                          base_fee:
                            type: integer
                          free_shipping_threshold:
                            type: integer
                      profile:
                        type: object
                        nullable: true
                        description: '2-9: store decor profile, null until the seller saves one.'
                      stats:
                        type: object
                        properties:
                          product_count:
                            type: integer
                          total_sold_count:
                            type: integer
                          store_rating:
                            type: number
                            nullable: true
                            description: Average of reviews on this partner's products; null when there are none.
                          review_count:
                            type: integer
                          followers:
                            type: integer
                            description: '2-9: store follow count.'
                          grade:
                            type: string
                            nullable: true
                            description: '2-9: latest monthly grade, null until computed.'
                      metrics:
                        type: object
                      products:
                        type: array
                        items:
                          type: object
        '404':
          description: Partner store not found

  /api/v1/products/{id}/live-activity:
    get:
      summary: Measured 24h purchase activity and stock for a product
      tags: [Storefront]
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Paid, non-refunded units only; same basis as urgency stats
          content:
            application/json:
              schema:
                type: object
                required: [success, product_id, data]
                properties:
                  success:
                    type: boolean
                  product_id:
                    type: string
                  data:
                    type: object
                    required: [recent_24h_purchases, all_time_sales, total_remaining_stock]
                    properties:
                      recent_24h_purchases:
                        type: integer
                      all_time_sales:
                        type: integer
                      total_remaining_stock:
                        type: integer
                      stock_urgency:
                        type: string
                        nullable: true
                      delivery_guarantee:
                        type: string
        '404':
          description: No ACTIVE product with this id

  /api/v1/search/visual-similarity:
    post:
      summary: Image similarity search (not available)
      tags: [Storefront]
      security: []
      description: No image model is integrated; always returns 501 so nothing is presented as a visual match.
      responses:
        '501':
          description: VISUAL_SEARCH_NOT_AVAILABLE with a keyword-search hint

  /api/v1/deals/lightning:
    get:
      summary: Retired lightning-deals feed (use campaigns feed)
      tags: [Storefront]
      security: []
      deprecated: true
      responses:
        '410':
          description: GONE; use GET /api/v1/campaigns/lightning

  /api/v1/products/{id}/reviews:
    get:
      summary: Review list with average rating summary
      tags: [Storefront]
      security: []
      description: '2-9: page/per_page, sort (latest, helpful, rating_high, rating_low), photos_only, rating and option filters; blind reviews stay out of list, total and summary; seller replies attached.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          schema:
            type: string
            enum: [latest, helpful, rating_high, rating_low]
            default: latest
        - name: photos_only
          in: query
          schema:
            type: string
          description: 'true/1 keeps only reviews with photos.'
        - name: rating
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - name: option
          in: query
          schema:
            type: string
          description: Substring match on the SKU option summary.
      responses:
        '200':
          description: Reviews newest-first; avg_rating is null when there are none
          content:
            application/json:
              schema:
                type: object
                required: [success, brand, product_id, review_count, reviews, data]
                properties:
                  success:
                    type: boolean
                  brand:
                    type: string
                  product_id:
                    type: string
                  avg_rating:
                    type: number
                    nullable: true
                  review_count:
                    type: integer
                  reviews:
                    type: array
                    items:
                      type: object
                  data:
                    type: object
                    properties:
                      reviews:
                        type: array
                        items:
                          type: object
                      summary:
                        type: object
                        properties:
                          count:
                            type: integer
                          average_rating:
                            type: number
                            nullable: true
                          distribution:
                            type: object
                            description: '2-9: star buckets 1..5 over visible reviews.'
                          photo_count:
                            type: integer
                          fit:
                            type: object
                            description: '2-9: fit-type counts over visible reviews.'
                      pagination:
                        $ref: '../schemas/common.yaml#/components/schemas/OffsetPageMeta'
        '400':
          description: Unknown sort or out-of-range rating filter
    post:
      summary: Write a verified-purchase review
      tags: [Storefront]
      description: Only a buyer with a delivered, non-refunded purchase of this product; one review per order.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating, content]
              properties:
                rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                  description: Buyer-chosen; nothing is defaulted.
                content:
                  type: string
                  maxLength: 3000
                  description: Alias comment is accepted.
                images:
                  type: array
                  maxItems: 10
                  items:
                    type: string
                user_height_cm:
                  type: integer
                user_weight_kg:
                  type: integer
                fit_type:
                  type: string
                  enum: [TRUE_TO_SIZE, RUNS_SMALL, RUNS_LARGE]
      responses:
        '201':
          description: Review created (verified purchase, masked reviewer name)
          content:
            application/json:
              schema:
                type: object
                required: [success, review_id, data]
                properties:
                  success:
                    type: boolean
                  review_id:
                    type: string
                  data:
                    type: object
        '400':
          description: Missing content or INVALID_RATING (1-5 required)
        '401':
          description: Missing or expired customer JWT
        '403':
          description: No delivered purchase of this product
        '409':
          description: REVIEW_EXISTS for this order

  /api/v1/products/{id}/qna:
    get:
      summary: Product Q&A list with secret-post masking
      tags: [Storefront]
      security: []
      description: Secret posts are masked unless the caller is the author (optional JWT).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Q&A newest-first
          content:
            application/json:
              schema:
                type: object
                required: [success, count, data]
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
    post:
      summary: Ask a product question
      tags: [Storefront]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                  maxLength: 2000
                is_secret:
                  type: boolean
      responses:
        '201':
          description: Question created with status WAITING
          content:
            application/json:
              schema:
                type: object
                required: [success, qna_id, data]
                properties:
                  success:
                    type: boolean
                  qna_id:
                    type: string
                  data:
                    type: object
        '400':
          description: Missing question
        '401':
          description: Missing or expired customer JWT
        '404':
          description: Product not found

  /api/v1/customs/validate-pccc:
    post:
      summary: Validate a personal customs clearance code (PCCC)
      tags: [Storefront]
      description: Requires a customer JWT (the Uni-Pass verdict is a per-person oracle). Format check only unless UNIPASS_API_KEY is configured; without Uni-Pass, verified is always false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pccc:
                  type: string
                  description: P followed by 12 digits, e.g. P123456789012.
                name:
                  type: string
                  description: Recipient name (alias recipient_name).
                phone:
                  type: string
                  description: Recipient phone (alias recipient_phone).
      responses:
        '200':
          description: Format verdict plus verification mode
          content:
            application/json:
              schema:
                type: object
                required: [success, verified, format_valid, verification_mode, data]
                properties:
                  success:
                    type: boolean
                  verified:
                    type: boolean
                  format_valid:
                    type: boolean
                  verification_mode:
                    type: string
                    enum: [FORMAT_ONLY, UNIPASS_MATCH, UNIPASS_NO_MATCH, UNIPASS_UNAVAILABLE]
                  message:
                    type: string
                  data:
                    type: object
        '400':
          description: MISSING_PCCC, INVALID_PCCC_FORMAT or INVALID_NAME
        '401':
          description: Missing or expired customer JWT

  /api/v1/fx/rates:
    get:
      summary: Operator-maintained display exchange rates
      tags: [Storefront]
      security: []
      description: Reference rates from the exchange_rates table (KRW base); payment is in KRW. Cached 300s.
      responses:
        '200':
          description: Rates for currencies with a table row
          content:
            application/json:
              schema:
                type: object
                required: [success, base_currency, supported_currencies, rates, inverse_rates]
                properties:
                  success:
                    type: boolean
                  base_currency:
                    type: string
                  supported_currencies:
                    type: array
                    items:
                      type: string
                  rates:
                    type: object
                    description: Per-currency table rate keyed by code (KRW is 1).
                  inverse_rates:
                    type: object
                  updated_at:
                    type: object
                    description: Per-currency row updated_at.
                  last_updated:
                    type: string
                    nullable: true
                  source:
                    type: string
                  source_note:
                    type: string

  /api/v1/customs/estimate-duty:
    post:
      summary: Estimate customs duty and VAT (DDP vs DDU)
      tags: [Storefront]
      security: []
      description: De-minimis threshold is USD 200 for US origin, USD 150 otherwise; above it ~8% tariff plus 10% VAT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                goods_amount_krw:
                  type: integer
                  description: Alias total_goods_amount.
                shipping_fee_krw:
                  type: integer
                  description: Alias total_shipping_amount.
                country_origin:
                  type: string
                  default: OTHER
      responses:
        '200':
          description: Duty estimate with DDP/DDU totals
          content:
            application/json:
              schema:
                type: object
                required: [success, brand, data]
                properties:
                  success:
                    type: boolean
                  brand:
                    type: string
                  data:
                    type: object
                    required: [total_order_krw, total_order_usd, is_tax_exempt, total_estimated_tax_krw]
                    properties:
                      total_order_krw:
                        type: integer
                      total_order_usd:
                        type: number
                      country_origin:
                        type: string
                      exemption_threshold_usd:
                        type: integer
                      is_tax_exempt:
                        type: boolean
                      estimated_tariff_krw:
                        type: integer
                      estimated_vat_krw:
                        type: integer
                      total_estimated_tax_krw:
                        type: integer
                      ddp_total_amount_krw:
                        type: integer
                      ddu_total_amount_krw:
                        type: integer
                      explanation:
                        type: string

  /api/v1/fx/convert:
    post:
      summary: Convert an amount between currencies
      tags: [Storefront]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                from:
                  type: string
                  default: KRW
                to:
                  type: string
                  default: USD
      responses:
        '200':
          description: Converted amount via the single-source FX table
          content:
            application/json:
              schema:
                type: object
                required: [success, from, to, original_amount, converted_amount]
                properties:
                  success:
                    type: boolean
                  from:
                    type: string
                  to:
                    type: string
                  original_amount:
                    type: number
                  converted_amount:
                    type: number
                  formatted:
                    type: string

  /api/v1/logistics/carriers:
    get:
      summary: Supported carrier directory
      tags: [Storefront]
      security: []
      responses:
        '200':
          description: Static cross-border and domestic carrier list
          content:
            application/json:
              schema:
                type: object
                required: [success, brand, count, data]
                properties:
                  success:
                    type: boolean
                  brand:
                    type: string
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
                      required: [code, name, type]
                      properties:
                        code:
                          type: string
                        name:
                          type: string
                        type:
                          type: string
                          enum: [CROSS_BORDER, DOMESTIC]
                        tracking_url:
                          type: string

  /api/v1/logistics/tracking/{subId}:
    get:
      summary: 7-stage milestone tracking timeline for a sub-order
      tags: [Storefront]
      description: Owner, fulfilling partner or ADMIN only. Only recorded carrier events are shown.
      parameters:
        - name: subId
          in: path
          required: true
          schema:
            type: string
          description: Sub-order id, sub_order_no or parent order id.
      responses:
        '200':
          description: Carrier info, milestone checklist and recorded timeline
          content:
            application/json:
              schema:
                type: object
                required: [success, brand, data]
                properties:
                  success:
                    type: boolean
                  brand:
                    type: string
                  data:
                    type: object
                    required: [sub_order_id, status, milestone_status, milestones, timeline]
                    properties:
                      sub_order_id:
                        type: string
                      sub_order_no:
                        type: string
                      order_no:
                        type: string
                      status:
                        type: string
                      milestone_status:
                        type: string
                      current_milestone:
                        type: string
                      carrier:
                        type: string
                        nullable: true
                      carrier_info:
                        type: object
                        nullable: true
                      tracking_number:
                        type: string
                        nullable: true
                      full_tracking_url:
                        type: string
                        nullable: true
                      pccc:
                        type: string
                        nullable: true
                        description: Masked PCCC.
                      milestones:
                        type: array
                        items:
                          type: object
                      logs:
                        type: array
                        items:
                          type: object
                      timeline:
                        type: array
                        items:
                          type: object
                      current_stage:
                        type: object
        '400':
          description: Missing sub_order_id
        '401':
          description: Missing or expired JWT
        '403':
          description: Only the order owner, fulfilling partner or ADMIN
        '404':
          description: Sub-order not found

  /api/v1/logistics/milestone-webhook:
    post:
      summary: Carrier milestone webhook ingestion
      tags: [Storefront]
      security: []
      description: Machine caller authenticated by the X-Carrier-Webhook-Secret shared secret (min 24 chars).
      parameters:
        - name: X-Carrier-Webhook-Secret
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sub_order_id, milestone]
              properties:
                sub_order_id:
                  type: string
                  description: Sub-order id or sub_order_no in SHIPPED, IN_TRANSIT or DELIVERED state.
                milestone:
                  type: string
                  description: 7-stage code, e.g. SHIPPED; alias stage_code.
                location:
                  type: string
                  maxLength: 200
                description:
                  type: string
                  maxLength: 500
                tracking_number:
                  type: string
                carrier:
                  type: string
                  description: Alias carrier_code; falls back to the sub-order's own carrier.
                customs_clearance_no:
                  type: string
      responses:
        '200':
          description: Milestone recorded and sub-order state advanced
          content:
            application/json:
              schema:
                type: object
                required: [success, brand, data]
                properties:
                  success:
                    type: boolean
                  brand:
                    type: string
                  message:
                    type: string
                  data:
                    type: object
        '400':
          description: Missing sub_order_id, STAGE_REQUIRED or UNKNOWN_STAGE
        '401':
          description: Webhook secret mismatch
        '409':
          description: NOT_IN_TRANSIT_STATE
        '503':
          description: WEBHOOK_NOT_CONFIGURED when the server secret is unset

  /api/v1/products/facets:
    get:
      summary: Facet counts under the current product filters
      tags: [Storefront]
      security: []
      description: '2-9: accepts the same filters as GET /api/v1/products; returns category counts, top 20 brands, price min/max and badge counts.'
      responses:
        '200':
          description: Facet summary
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [categories, brands, price, badges]
                    properties:
                      categories:
                        type: array
                        items:
                          type: object
                      brands:
                        type: array
                        items:
                          type: object
                      price:
                        type: object
                      badges:
                        type: object

  /api/v1/products/{id}/coupons:
    get:
      summary: Coupons applicable to one product
      tags: [Storefront]
      security: []
      description: '2-9: coupons in scope for the product; with a customer JWT each row carries claimed=true when held.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Applicable coupons with claimed flags
        '404':
          description: Unknown product id

  /api/v1/products/{id}/price-history:
    get:
      summary: SKU price history for fake-discount policing
      tags: [Storefront]
      security: []
      description: '3-4: newest-first original/sale moves across the product SKUs, capped at 50.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: History rows (possibly empty)
        '404':
          description: Unknown product id

  /api/v1/exhibitions:
    get:
      summary: Live exhibitions
      tags: [Storefront]
      security: []
      description: '2-9: ACTIVE exhibitions inside their window, newest first. 3-1: each carries products (on-sale lineup, max 8).'
      responses:
        '200':
          description: Live exhibitions with product lineups

  /api/v1/exhibitions/{id}:
    get:
      summary: One live exhibition with products
      tags: [Storefront]
      security: []
      description: '2-9: ended or draft exhibitions answer 404.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Exhibition with attached products
        '404':
          description: Unknown or ended exhibition
