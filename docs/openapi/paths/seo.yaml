# Phase 4-6 SEO/GEO/AEO + crawl architecture (IndexNow queue ops). Verified
# against apps/cloudflare-gateway/src/routes/seo-ops.js. All endpoints are
# admin-only. Public crawl assets (/sitemap*.xml, /robots.txt, /llms*.txt)
# are plain GET files, not versioned APIs, so they stay out of this contract.
paths:
  /api/v1/admin/seo/indexnow/enqueue:
    post:
      summary: Enqueue URLs for IndexNow submission
      tags: [SEO]
      description: 'Phase 4-6: validates same-site https URLs and inserts PENDING rows into indexnow_queue (idempotent per URL).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [urls]
              properties:
                urls:
                  type: array
                  maxItems: 1000
                  items:
                    type: string
      responses:
        '200':
          description: Enqueue count
        '400':
          description: URLS_REQUIRED, INVALID_URL or URL_NOT_INDEXABLE
        '401':
          description: Missing or expired JWT
        '403':
          description: Admin role required

  /api/v1/admin/seo/indexnow/status:
    get:
      summary: IndexNow queue status summary
      tags: [SEO]
      description: 'Phase 4-6: key_configured flag plus PENDING/SENT/FAILED counts for the admin console.'
      responses:
        '200':
          description: Status counts
        '401':
          description: Missing or expired JWT
        '403':
          description: Admin role required

  /api/v1/admin/seo/indexnow/queue:
    get:
      summary: IndexNow queue status log
      tags: [SEO]
      description: 'Phase 4-6: newest-first indexnow_queue rows with per-URL status, attempts and last error. The admin status log.'
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, SENT, FAILED]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        '200':
          description: Queue rows
        '400':
          description: INVALID_STATUS
        '401':
          description: Missing or expired JWT
        '403':
          description: Admin role required

  /api/v1/admin/seo/indexnow/drain:
    post:
      summary: Submit one pending batch to IndexNow
      tags: [SEO]
      description: 'Phase 4-6: POSTs up to 100 PENDING URLs to the IndexNow endpoint and marks them SENT/FAILED. Without INDEXNOW_KEY it reports degraded and leaves rows PENDING.'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
      responses:
        '200':
          description: Drain counts with degraded flag
        '401':
          description: Missing or expired JWT
        '403':
          description: Admin role required

  /api/v1/seo/page:
    get:
      summary: Edge rendering data for one storefront path
      tags: [SEO]
      security: []
      description: '6-2: head (title, description, robots, canonical, hreflang, OG, Twitter), JSON-LD graphs and a plain summary block built from live rows, injected by the apex worker into index.html for every visitor alike. Missing or not-live product/category/store answers status 404 in the body; paths with nothing to add answer status "pass". /en and /ja mirror prefixes are stripped (canonical is the ko URL). Cached public, s-maxage=300.'
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
            maxLength: 512
            pattern: '^/'
      responses:
        '200':
          description: '{ status: 200|404|"pass", head, jsonld[], summary_html }'
        '400':
          description: Path missing the leading slash or longer than 512 characters
