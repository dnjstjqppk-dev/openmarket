# Finance paths (cash receipts, tax invoices, reconciliation, journal, refunds).
# Verified against the gateway implementation (apps/cloudflare-gateway/src/routes/finance.js)
# in the P0-11 Wave 2 sweep (2026-11-10); every path below is covered by
# tests/openapi_reconciliation_test.mjs.
paths:
  /api/v1/finance/cash-receipts/request:
    post:
      summary: Request a cash receipt (현금영수증) for a paid cash-method order
      tags: [Finance]
      description: >
        Buyer-only request; there is no NTS/PG cash-receipt API integration.
        The operator issues the receipt in the PG console or Hometax and records
        the real approval number via POST
        /api/v1/admin/finance/cash-receipts/{id}/issue. Only TRANSFER and
        VIRTUAL_ACCOUNT payments qualify; card payments are rejected with
        NOT_CASH_PAYMENT. Repeat requests for the same order return 200 with
        already_requested instead of creating a duplicate — unless a refund
        landed after the request, in which case the stale REQUESTED row is
        superseded and a fresh row is computed on the net cash basis
        (total_pay minus refunded PG). Fully refunded or cancelled orders are
        rejected with ORDER_REFUNDED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id]
              properties:
                order_id:
                  type: string
                  description: Order id or order_no of the buyer's own order.
                buyer_identifier:
                  type: string
                  maxLength: 20
                  description: Phone digits or business registration number (identity_number is accepted as an alias).
                identity_number:
                  type: string
                  maxLength: 20
                  description: Alias of buyer_identifier.
                identifier_type:
                  type: string
                  enum: [PHONE, BUSINESS_REG_NO]
                  description: Defaults to BUSINESS_REG_NO when receipt_type is BUSINESS, else PHONE.
                receipt_type:
                  type: string
                  description: BUSINESS selects BUSINESS_REG_NO identifier type.
      responses:
        '201':
          description: Receipt request accepted (identifier masked in the response)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
        '200':
          description: Receipt already requested or issued for this order (already_requested)
          content:
            application/json:
              schema:
                type: object
                required: [success, already_requested, data]
                properties:
                  success:
                    type: boolean
                  already_requested:
                    type: boolean
                  data:
                    type: object
        '400':
          description: INVALID_IDENTIFIER, ORDER_NOT_PAID, NOT_CASH_PAYMENT, ORDER_REFUNDED or NO_CASH_BASIS
        '401':
          description: Missing or expired JWT, or not a customer session
        '404':
          description: Unknown order id, or not the buyer's own order

  /api/v1/finance/cash-receipts:
    get:
      summary: List the buyer's own cash receipts (masked)
      tags: [Finance]
      description: Newest-first CASH_RECEIPT rows of the caller's own orders (limit 100).
      responses:
        '200':
          description: Receipt rows with masked buyer identifiers
          content:
            application/json:
              schema:
                type: object
                required: [success, count, data]
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
        '401':
          description: Missing or expired JWT, or not a customer session

  /api/v1/finance/cash-receipts/{id}/cancel:
    post:
      summary: Cancel the buyer's own REQUESTED receipt
      tags: [Finance]
      description: >
        The id is the tax_invoices row id. Only the ordering buyer's own
        REQUESTED rows can be cancelled; anything else is 409 NOT_CANCELLABLE.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Receipt marked CANCELLED
        '401':
          description: Missing or expired JWT, or not a customer session
        '409':
          description: NOT_CANCELLABLE when the row is not the buyer's pending request

  /api/v1/finance/cash-receipts/{id}:
    get:
      summary: Look up the latest cash receipt by order id or order number
      tags: [Finance]
      description: >
        The path id is an order id OR order_no (not the receipt id). Buyers see
        only their own orders; ADMIN callers may look up any order. The
        buyer_identifier is masked in the response.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Order id or order_no whose latest CASH_RECEIPT row is returned.
      responses:
        '200':
          description: Latest cash receipt row for the order
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '401':
          description: Missing or expired JWT
        '404':
          description: No cash receipt request exists for this order

  /api/v1/finance/tax-invoices:
    get:
      summary: List tax invoice and cash receipt rows (operator, latest 100)
      tags: [Finance]
      parameters:
        - name: invoice_type
          in: query
          schema:
            type: string
            enum: [CASH_RECEIPT, TAX_INVOICE_PURCHASE, TAX_INVOICE_SALES]
        - name: partner_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Newest-first invoice rows with masked buyer identifiers
          content:
            application/json:
              schema:
                type: object
                required: [success, count, data]
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
        '401':
          description: Missing or expired JWT
        '403':
          description: Not an admin session

  /api/v1/admin/finance/cash-receipts/{id}/issue:
    post:
      summary: Record a cash receipt issuance with the real approval number
      tags: [Finance]
      description: >
        Records an issuance the operator performed in the PG console or Hometax.
        Only REQUESTED rows can be processed; the loser of a concurrent
        issue/fail race gets 409 NOT_REQUESTED. The order basis is re-verified
        at issue time: a refund after the request, or an order that is no
        longer PAID/PARTIAL_REFUNDED, is rejected with 409 RECEIPT_NEEDS_REISSUE
        (the buyer must re-request on the net basis).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: tax_invoices row id (invoice_type CASH_RECEIPT).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hometax_approval_no]
              properties:
                hometax_approval_no:
                  type: string
                  maxLength: 40
                  description: Real NTS approval number (6-40 alphanumerics and dashes).
                memo:
                  type: string
                  maxLength: 300
      responses:
        '200':
          description: Receipt marked ISSUED
          content:
            application/json:
              schema:
                type: object
                required: [success, id, issue_status]
                properties:
                  success:
                    type: boolean
                  id:
                    type: string
                  issue_status:
                    type: string
                    enum: [ISSUED]
        '400':
          description: INVALID_APPROVAL_NO when the approval number shape is wrong
        '401':
          description: Missing or expired JWT
        '403':
          description: Not an admin session
        '404':
          description: Unknown cash receipt id
        '409':
          description: NOT_REQUESTED when the row is no longer in REQUESTED state, or RECEIPT_NEEDS_REISSUE when the order basis changed after the request

  /api/v1/admin/finance/cash-receipts/{id}/fail:
    post:
      summary: Mark a cash receipt request as failed with a reason
      tags: [Finance]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: tax_invoices row id (invoice_type CASH_RECEIPT).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 300
      responses:
        '200':
          description: Receipt marked FAILED
          content:
            application/json:
              schema:
                type: object
                required: [success, id, issue_status]
                properties:
                  success:
                    type: boolean
                  id:
                    type: string
                  issue_status:
                    type: string
                    enum: [FAILED]
        '401':
          description: Missing or expired JWT
        '403':
          description: Not an admin session
        '404':
          description: Unknown cash receipt id
        '409':
          description: NOT_REQUESTED when the row is no longer in REQUESTED state

  /api/v1/admin/finance/cash-receipts/{id}/cancel-record:
    post:
      summary: Record the PG-console cancellation of a CANCEL_REQUIRED receipt (admin)
      tags: [Finance]
      description: >
        A finalized refund flips an ISSUED receipt to CANCEL_REQUIRED (a
        REQUESTED one dies silently). The operator cancels the receipt in the
        PG console and records the reference here, closing the row as
        CANCELLED.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: tax_invoices row id (invoice_type CASH_RECEIPT).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cancel_ref]
              properties:
                cancel_ref:
                  type: string
                  maxLength: 100
      responses:
        '200':
          description: Receipt marked CANCELLED
        '400':
          description: cancel_ref missing
        '401':
          description: Missing or expired JWT
        '403':
          description: Not an admin session
        '409':
          description: NOT_CANCEL_REQUIRED when the row is not awaiting cancellation

  /api/v1/admin/finance/sales-report:
    get:
      summary: Sales report with journal-true revenue (admin)
      tags: [Finance]
      description: >
        Revenue (direct_net, commission_net, seller_net) is aggregated from
        journal_entries net of refunds; GMV and order counts come from paid
        orders. Dates are UTC calendar days, default the last 30 days, max
        366-day span. Aggregates only — no buyer personal data.
      parameters:
        - name: from
          in: query
          schema:
            type: string
            description: YYYY-MM-DD, defaults to 29 days ago.
        - name: to
          in: query
          schema:
            type: string
            description: YYYY-MM-DD, defaults to today.
        - name: group_by
          in: query
          schema:
            type: string
            enum: [day, partner]
            default: day
      responses:
        '200':
          description: Totals plus a day or partner series
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '400':
          description: INVALID_PERIOD, PERIOD_TOO_WIDE or INVALID_GROUP_BY
        '401':
          description: Missing or expired JWT, or not an admin

  /api/v1/admin/finance/tax-invoices:
    post:
      summary: NEW-15. Create a seller commission tax invoice draft for a settlement period
      tags: [Finance]
      description: >
        Amounts are server-computed from the partner's accrued settlements in
        the period (never client-supplied). One row per partner+period via a
        partial unique index; the operator issues the invoice in Hometax and
        records the approval number with /issue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partner_id, period_start, period_end]
              properties:
                partner_id:
                  type: string
                period_start:
                  type: string
                  description: YYYY-MM-DD, first day of the settlement period.
                period_end:
                  type: string
                  description: YYYY-MM-DD, last day of the settlement period.
      responses:
        '201':
          description: Commission tax invoice draft created in REQUESTED state
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
        '400':
          description: INVALID_PERIOD when the period shape is wrong
        '401':
          description: Missing or expired JWT
        '403':
          description: Not an admin session
        '404':
          description: Unknown partner id
        '409':
          description: NO_COMMISSION when nothing accrued, DUPLICATE_PERIOD on re-create

  /api/v1/admin/finance/tax-invoices/{id}/issue:
    post:
      summary: NEW-15. Record a commission tax invoice issuance with the real approval number
      tags: [Finance]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: tax_invoices row id (invoice_type TAX_INVOICE_SALES).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hometax_approval_no]
              properties:
                hometax_approval_no:
                  type: string
                  maxLength: 40
                memo:
                  type: string
                  maxLength: 300
      responses:
        '200':
          description: Invoice marked ISSUED
          content:
            application/json:
              schema:
                type: object
                required: [success, id, issue_status]
                properties:
                  success:
                    type: boolean
                  id:
                    type: string
                  issue_status:
                    type: string
                    enum: [ISSUED]
        '400':
          description: INVALID_APPROVAL_NO when the approval number shape is wrong
        '401':
          description: Missing or expired JWT
        '403':
          description: Not an admin session
        '404':
          description: Unknown commission tax invoice id
        '409':
          description: NOT_REQUESTED when the row is no longer in REQUESTED state

  /api/v1/admin/finance/tax-invoices/{id}/fail:
    post:
      summary: NEW-15. Mark a commission tax invoice as failed with a reason
      tags: [Finance]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: tax_invoices row id (invoice_type TAX_INVOICE_SALES).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 300
      responses:
        '200':
          description: Invoice marked FAILED
          content:
            application/json:
              schema:
                type: object
                required: [success, id, issue_status]
                properties:
                  success:
                    type: boolean
                  id:
                    type: string
                  issue_status:
                    type: string
                    enum: [FAILED]
        '401':
          description: Missing or expired JWT
        '403':
          description: Not an admin session
        '404':
          description: Unknown commission tax invoice id
        '409':
          description: NOT_REQUESTED when the row is no longer in REQUESTED state

  /api/v1/admin/reconciliation:
    get:
      summary: Run the full R01-R23 ledger reconciliation now (manual trigger)
      tags: [Finance]
      description: >
        Runs all checks, persists a reconciliation_runs row, and alerts on
        failure via ALERT_WEBHOOK_URL (or records NO_CHANNEL). Same engine as
        the hourly CRON run.
      responses:
        '200':
          description: Reconciliation outcome with per-check violations
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [ok, checked_at, checks, run_id, alert_status]
                    properties:
                      ok:
                        type: boolean
                      checked_at:
                        type: string
                      run_id:
                        type: string
                      alert_status:
                        type: string
                        enum: [NOT_NEEDED, SENT, FAILED, NO_CHANNEL]
                      checks:
                        type: array
                        items:
                          type: object
                          required: [id, name, ok, violations, violation_count]
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            ok:
                              type: boolean
                            violations:
                              type: array
                              items:
                                type: object
                            violation_count:
                              type: integer
        '401':
          description: Missing or expired JWT
        '403':
          description: Not an admin session

  /api/v1/admin/finance/reconciliation-runs:
    get:
      summary: Reconciliation run history (latest 100) with last CRON status
      tags: [Finance]
      responses:
        '200':
          description: Past runs, the latest CRON run, and alert channel state
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [runs, last_cron, alert_channel_configured]
                    properties:
                      runs:
                        type: array
                        items:
                          type: object
                      last_cron:
                        type: object
                        nullable: true
                      alert_channel_configured:
                        type: boolean
        '401':
          description: Missing or expired JWT
        '403':
          description: Not an admin session

  /api/v1/admin/finance/reserve-holds:
    get:
      summary: List rolling-reserve holds, optionally for one seller
      tags: [Finance]
      parameters:
        - name: partner_id
          in: query
          required: false
          schema:
            type: string
          description: Restrict rows to one partner; omit for all holds (latest 500).
      responses:
        '200':
          description: Reserve hold rows with seller name and releasable flag
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
        '401':
          description: Missing or expired JWT
        '403':
          description: Not an admin session

  /api/v1/admin/finance/trial-balance:
    get:
      summary: Trial balance grouped by operating entity and account
      tags: [Finance]
      parameters:
        - name: entity_id
          in: query
          required: false
          schema:
            type: string
          description: Restrict rows to one operating entity; omit for all entities.
      responses:
        '200':
          description: Per-account debit, credit and balance rows
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
        '401':
          description: Missing or expired JWT
        '403':
          description: Not an admin session

  /api/v1/admin/finance/journal:
    get:
      summary: Journal entries, optionally for one order (latest 500)
      tags: [Finance]
      parameters:
        - name: order_id
          in: query
          required: false
          schema:
            type: string
          description: Restrict rows to one order; omit for the latest entries.
      responses:
        '200':
          description: Newest-first journal entry rows
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
        '401':
          description: Missing or expired JWT
        '403':
          description: Not an admin session

  /api/v1/admin/finance/fees/recalc:
    post:
      summary: Verify-only fee recomputation over explicit orders (never rewrites)
      tags: [Finance]
      description: >
        Recomputes each order's commission under the schedules valid at its own
        time and compares with the recorded settlements. Mismatches and failures
        are reported; nothing is rewritten (no retroactive application).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_ids]
              properties:
                order_ids:
                  type: array
                  maxItems: 5000
                  items:
                    type: string
      responses:
        '200':
          description: Verification report (processed/matched/mismatched/failed)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
        '400':
          description: Missing or oversized order_ids
        '401':
          description: Missing or expired JWT
        '403':
          description: Not an admin session

  /api/v1/admin/finance/payouts/{id}/transferred:
    post:
      summary: Record the manual bank transfer reference for an APPROVED payout
      tags: [Finance]
      description: >
        Payouts are wired manually at a bank; this call moves the payout from
        APPROVED to TRANSFERRED with the transfer reference.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Payout id in APPROVED status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bank_transfer_ref]
              properties:
                bank_transfer_ref:
                  type: string
                  maxLength: 100
      responses:
        '200':
          description: Payout marked TRANSFERRED
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
        '401':
          description: Missing or expired JWT
        '403':
          description: Not an admin session
        '409':
          description: PAYOUT_NOT_APPROVED when the payout is not APPROVED

  /api/v1/admin/orders/{id}/refund:
    post:
      summary: Manual admin refund of order lines and/or shipping shares
      tags: [Finance]
      description: >
        Runs the shared refund engine with reason code ADMIN:{reason} and writes
        a MANUAL_REFUND audit row. Accepts an optional X-Idempotency-Key header.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Order id to refund.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 200
                lines:
                  type: array
                  description: Item lines to refund; empty means shipping-only refund.
                  items:
                    type: object
                    required: [order_item_id, quantity]
                    properties:
                      order_item_id:
                        type: string
                      quantity:
                        type: number
                shipping_sub_order_ids:
                  type: array
                  description: Sub-orders whose shipping share is refunded.
                  items:
                    type: string
                restock:
                  type: boolean
                  description: Restock refunded quantities when true.
      responses:
        '200':
          description: Refund engine result (replay flag, refund row, order status, warnings)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [replay, refund, orderStatus]
                    properties:
                      replay:
                        type: boolean
                      refund:
                        type: object
                      orderStatus:
                        type: string
                      warnings:
                        type: array
                        items:
                          type: string
        '400':
          description: NOTHING_TO_REFUND when neither lines nor shipping shares are given
        '401':
          description: Missing or expired JWT
        '403':
          description: Not an admin session

  /api/v1/admin/sub-orders/{id}/delivered:
    post:
      summary: Manually mark a shipped sub-order as delivered with evidence
      tags: [Finance]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Sub-order id in SHIPPED or IN_TRANSIT status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [evidence]
              properties:
                evidence:
                  type: string
                  maxLength: 300
                  description: Delivery proof such as the carrier tracking result.
      responses:
        '200':
          description: Sub-order marked DELIVERED
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
        '401':
          description: Missing or expired JWT
        '403':
          description: Not an admin session
        '409':
          description: NOT_IN_TRANSIT when the sub-order is not shipped
