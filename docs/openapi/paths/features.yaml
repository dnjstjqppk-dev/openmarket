# Features paths (coupons, credits, wishlist, support, banners, addresses, notifications).
# Verified against the gateway implementation (apps/cloudflare-gateway/src/routes/features.js)
# in the P0-11 Wave 2 sweep (2026-11-10); every path below is covered by
# tests/openapi_reconciliation_test.mjs.
paths:
  /api/v1/coupons:
    get:
      summary: Coupon wallet grouped into usable, claimable and used/expired
      tags: [Features]
      security: []
      description: '2-9 wallet: usable holds an unused live holding per row (with user_coupon_id, issuer and scope); claimable lists live downloadable offers with quantity left that the caller has no unused holding of (AUTO coupons never appear); used_expired holds used or dead holdings. Anonymous callers get empty usable/used_expired.'
      responses:
        '200':
          description: Grouped coupon wallet
          content:
            application/json:
              schema:
                type: object
                required: [success, count, data]
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  data:
                    type: object
                    required: [usable, claimable, used_expired]
                    properties:
                      usable:
                        type: array
                        items:
                          type: object
                      claimable:
                        type: array
                        items:
                          type: object
                      used_expired:
                        type: array
                        items:
                          type: object

  /api/v1/coupons/claim:
    post:
      summary: Claim a coupon into my coupon wallet
      tags: [Features]
      parameters:
        - $ref: '../schemas/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                coupon_id:
                  type: string
                  description: Coupon id or code (case-insensitive code match).
                code:
                  type: string
                  description: Alias of coupon_id.
      responses:
        '200':
          description: Coupon issued (idempotent; same-key replay returns the same grant)
          content:
            application/json:
              schema:
                type: object
                required: [success, coupon, data]
                properties:
                  success:
                    type: boolean
                  coupon:
                    type: object
                  data:
                    type: object
                  user_coupon_id:
                    type: string
                  idempotent_replay:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Missing idempotency key (IDEMPOTENCY_KEY_REQUIRED)
        '401':
          description: Missing or expired JWT (UNAUTHENTICATED)
        '404':
          description: Invalid, inactive or expired coupon code
        '409':
          description: Sold out (COUPON_SOLD_OUT), per-user limit (COUPON_LIMIT_REACHED) or already claimed (COUPON_ALREADY_CLAIMED)

  /api/v1/credits:
    get:
      summary: My credit balance and ledger history
      tags: [Features]
      responses:
        '200':
          description: Balance is the SUM of amount_delta over the ledger
          content:
            application/json:
              schema:
                type: object
                required: [success, customer_id, balance, data]
                properties:
                  success:
                    type: boolean
                  customer_id:
                    type: string
                  balance:
                    type: integer
                  data:
                    type: object
                    required: [balance, history]
                    properties:
                      balance:
                        type: integer
                      history:
                        type: array
                        description: user_credits rows, newest first; each row carries amount and amount_delta.
                        items:
                          type: object
        '401':
          description: Missing or expired JWT (UNAUTHENTICATED)

  /api/v1/wishlist:
    get:
      summary: My wishlist with product detail
      tags: [Features]
      responses:
        '200':
          description: Wishlist rows joined with products, category and brand
          content:
            application/json:
              schema:
                type: object
                required: [success, count, data]
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        wishlist_id:
                          type: string
                        wished_at:
                          type: string
                        product_id:
                          type: string
                        slug:
                          type: string
                        brand:
                          type: string
                        category_name:
                          type: string
        '401':
          description: Missing or expired JWT (UNAUTHENTICATED)
    post:
      summary: Toggle a product in my wishlist (add or remove)
      tags: [Features]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id]
              properties:
                product_id:
                  type: string
      responses:
        '200':
          description: Toggle result; wished false means the row was removed
          content:
            application/json:
              schema:
                type: object
                required: [success, wished, action, product_id]
                properties:
                  success:
                    type: boolean
                  wished:
                    type: boolean
                  action:
                    type: string
                    enum: [ADDED, REMOVED]
                  product_id:
                    type: string
        '400':
          description: product_id required
        '401':
          description: Missing or expired JWT (UNAUTHENTICATED)
  /api/v1/cart:
    get:
      summary: My cart lines with live SKU prices
      tags: [Features]
      description: Customer route (P1-M05). Returns sku_id + quantity lines joined with live sale price, stock and product title/thumbnail. Prices are never stored — the checkout re-prices everything.
      responses:
        '200':
          description: Cart lines with live product data
          content:
            application/json:
              schema:
                type: object
                required: [success, count, data]
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        sku_id:
                          type: string
                        quantity:
                          type: integer
                        product_id:
                          type: string
                        sale_price:
                          type: integer
                        stock_quantity:
                          type: integer
                        title:
                          type: string
                        thumbnail_url:
                          type: string
        '401':
          description: Missing or expired JWT (UNAUTHENTICATED)
    put:
      summary: Replace my cart lines (server sync)
      tags: [Features]
      description: Customer route (P1-M05). Replace semantics — the full line set overwrites the stored cart. Unknown SKUs fail the whole write with 400 INVALID_SKU (nothing is stored), so the client can show exactly which line failed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [sku_id, quantity]
                    properties:
                      sku_id:
                        type: string
                      quantity:
                        type: integer
                        minimum: 1
                        maximum: 99
      responses:
        '200':
          description: Stored line set
          content:
            application/json:
              schema:
                type: object
                required: [success, count, data]
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
        '400':
          description: ITEMS_REQUIRED, SKU_REQUIRED, INVALID_QUANTITY, INVALID_SKU or CART_TOO_LARGE
        '401':
          description: Missing or expired JWT (UNAUTHENTICATED)

  /api/v1/support/faq:
    get:
      summary: Static support FAQ list
      tags: [Features]
      security: []
      description: Hardcoded FAQ entries (shipping, price-match, returns, payout, partner onboarding); no database read.
      responses:
        '200':
          description: FAQ entries with category, q and a
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
                      required: [category, q, a]
                      properties:
                        category:
                          type: string
                        q:
                          type: string
                        a:
                          type: string

  /api/v1/support/inquiries:
    get:
      summary: My 1:1 support inquiries
      tags: [Features]
      responses:
        '200':
          description: support_inquiries rows, newest first; each row carries message as an alias of content
          content:
            application/json:
              schema:
                type: object
                required: [success, count, data]
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
        '401':
          description: Missing or expired JWT (UNAUTHENTICATED)
    post:
      summary: File a 1:1 support inquiry
      tags: [Features]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
                  maxLength: 200
                content:
                  type: string
                  maxLength: 5000
                  description: Message body; message is accepted as an alias.
                message:
                  type: string
                category:
                  type: string
                  enum: [DELIVERY, REFUND_RETURN, PRICE_MATCH, PAYMENT, PARTNER_JOIN, OTHER]
                  description: Unknown values fall back to OTHER.
                order_id:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Inquiry opened with status OPEN
          content:
            application/json:
              schema:
                type: object
                required: [success, inquiry_id, data]
                properties:
                  success:
                    type: boolean
                  inquiry_id:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      inquiry_id:
                        type: string
                      status:
                        type: string
                  message:
                    type: string
        '400':
          description: Subject and content are both required
        '401':
          description: Missing or expired JWT (UNAUTHENTICATED)

  /api/v1/banners:
    get:
      summary: Active promotional banners for the homepage
      tags: [Features]
      security: []
      responses:
        '200':
          description: Banners ordered by display_order
          content:
            application/json:
              schema:
                type: object
                required: [success, count, data]
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                        subtitle:
                          type: string
                        badge_text:
                          type: string
                        image_url:
                          type: string
                        link_url:
                          type: string
                        bg_gradient:
                          type: string
                        display_order:
                          type: integer

  /api/v1/addresses:
    get:
      summary: My address book, default first
      tags: [Features]
      responses:
        '200':
          description: user_addresses rows ordered by is_default then newest
          content:
            application/json:
              schema:
                type: object
                required: [success, count, data]
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
        '401':
          description: Missing or expired JWT (UNAUTHENTICATED)
    post:
      summary: Add an address to my address book
      tags: [Features]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recipient_name:
                  type: string
                  description: Required; name is accepted as an alias.
                name:
                  type: string
                phone:
                  type: string
                  description: Required.
                postal_code:
                  type: string
                  description: Defaults to 00000; zip is accepted as an alias.
                address_line1:
                  type: string
                  description: Required; address is accepted as an alias.
                address_line2:
                  type: string
                  description: detail_address is accepted as an alias.
                is_default:
                  type: integer
                  description: Truthy clears the previous default atomically.
                delivery_note:
                  type: string
                  description: note is accepted as an alias.
      responses:
        '201':
          description: Created address row
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
        '400':
          description: Recipient, phone and address_line1 are required
        '401':
          description: Missing or expired JWT (UNAUTHENTICATED)

  /api/v1/addresses/{id}/default:
    put:
      summary: Set an address as my default
      tags: [Features]
      description: POST to this path is an alias of this operation (same handler; storefront uses PUT).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Default switched (previous default cleared atomically)
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Missing or expired JWT (UNAUTHENTICATED)
        '404':
          description: Address not found or belongs to another user

  /api/v1/addresses/{id}:
    delete:
      summary: Delete one of my addresses
      tags: [Features]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Address deleted
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Missing or expired JWT (UNAUTHENTICATED)
        '404':
          description: Address not found or belongs to another user

  /api/v1/notifications:
    get:
      summary: My latest notifications with unread count
      tags: [Features]
      responses:
        '200':
          description: Newest 20 notifications rows; unread_count counts is_read = 0 within them
          content:
            application/json:
              schema:
                type: object
                required: [success, unread_count, count, data]
                properties:
                  success:
                    type: boolean
                  unread_count:
                    type: integer
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
        '401':
          description: Missing or expired JWT (UNAUTHENTICATED)

  /api/v1/notifications/dispatch:
    post:
      summary: Dispatch an SMS/AlimTalk/email via the external provider (admin)
      tags: [Features]
      description: Requires ADMIN. Sends through SOLAPI when SOLAPI_API_KEY/SECRET are configured; otherwise logs NOT_SENT_PROVIDER_NOT_CONFIGURED. Every attempt is recorded in notification_delivery_logs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                channel:
                  type: string
                  description: Uppercased; defaults to ALIMTALK.
                recipient:
                  type: string
                  description: Required; phone or email are accepted as aliases.
                template_code:
                  type: string
                  description: Uppercased; defaults to ORDER_NOTIFICATION.
                title:
                  type: string
                  description: Defaults to the OLMOA notice title.
                content:
                  type: string
                  description: message is accepted as an alias.
      responses:
        '200':
          description: Dispatch attempt logged with honest provider status
          content:
            application/json:
              schema:
                type: object
                required: [success, provider_configured, data]
                properties:
                  success:
                    type: boolean
                  provider_configured:
                    type: boolean
                  data:
                    type: object
                    required: [log_id, channel, recipient, template_code, status, provider]
                    properties:
                      log_id:
                        type: string
                      channel:
                        type: string
                      recipient:
                        type: string
                      template_code:
                        type: string
                      status:
                        type: string
                        description: SENT, FAILED or NOT_SENT_PROVIDER_NOT_CONFIGURED.
                      provider:
                        type: string
                      provider_msg_id:
                        type: string
                        nullable: true
                      dispatched_at:
                        type: string
        '400':
          description: recipient is required for dispatch
        '401':
          description: Missing or expired JWT (UNAUTHENTICATED)
        '403':
          description: ADMIN role required

  /api/v1/notifications/read-all:
    put:
      summary: Mark all my notifications as read
      tags: [Features]
      description: POST to this path is an alias of this operation (same handler; PUT matches the sibling single-read route used by the storefront).
      responses:
        '200':
          description: All notifications marked read
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Missing or expired JWT (UNAUTHENTICATED)

  /api/v1/notifications/{id}/read:
    put:
      summary: Mark one notification as read
      tags: [Features]
      description: POST to this path is an alias of this operation (same handler; storefront uses PUT).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification marked read (idempotent; unknown ids still return success)
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '401':
          description: Missing or expired JWT (UNAUTHENTICATED)

  /api/v1/coupons/best:
    post:
      summary: Best coupon combination for my cart
      tags: [Features]
      description: '2-9: one platform coupon plus the best store coupon per seller, evaluated in checkout order (store first, platform on the remainder). An estimate; checkout re-verifies. 3-5: optional items[] estimates device-local carts (max 100); omitted body uses the server cart.'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [sku_id, quantity]
                    properties:
                      sku_id:
                        type: string
                      quantity:
                        type: integer
      responses:
        '200':
          description: Best combination (platform may be null on an empty cart)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [platform, store, total_discount]
                    properties:
                      platform:
                        type: object
                        nullable: true
                      store:
                        type: array
                        items:
                          type: object
                      total_discount:
                        type: integer
        '401':
          description: Missing or expired JWT (UNAUTHENTICATED)

  /api/v1/reviews/{id}/helpful:
    post:
      summary: Toggle helpful on a review
      tags: [Features]
      description: '2-9: second call untoggles. Own reviews are rejected (403).'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: New vote state and stored count
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [helpful, count]
                    properties:
                      helpful:
                        type: boolean
                      count:
                        type: integer
        '401':
          description: Missing or expired JWT (UNAUTHENTICATED)
        '403':
          description: Own review (FORBIDDEN)
        '404':
          description: Unknown review (NOT_FOUND)

  /api/v1/reviews/{id}/report:
    post:
      summary: Report a review
      tags: [Features]
      description: '2-9: reason must be PROFANITY, PRIVACY, AD, IRRELEVANT or OTHER; one report per member per review.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        '201':
          description: Report recorded
        '400':
          description: Invalid reason (INVALID_REASON)
        '401':
          description: Missing or expired JWT (UNAUTHENTICATED)
        '404':
          description: Unknown review (NOT_FOUND)
        '409':
          description: Duplicate report (REPORT_EXISTS)

  /api/v1/stores/{partnerId}/follow:
    post:
      summary: Follow a store
      tags: [Features]
      description: '2-9: idempotent; unknown sellers 404.'
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Following state
        '401':
          description: Missing or expired JWT (UNAUTHENTICATED)
        '404':
          description: Unknown seller (NOT_FOUND)
    delete:
      summary: Unfollow a store
      tags: [Features]
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Following state
        '401':
          description: Missing or expired JWT (UNAUTHENTICATED)
        '404':
          description: Unknown seller (NOT_FOUND)

  /api/v1/stores/{partnerId}/reviews:
    get:
      summary: Visible reviews on a seller's products
      tags: [Features]
      description: '3-10: public, newest first. Query: page, per_page (default 20, max 100).'
      parameters:
        - name: partnerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Store reviews with pagination
        '404':
          description: Unknown or non-approved seller (NOT_FOUND)

  /api/v1/me/followed-stores:
    get:
      summary: Stores I follow
      tags: [Features]
      description: '2-9: followed stores with business name and active product count.'
      responses:
        '200':
          description: Followed stores
        '401':
          description: Missing or expired JWT (UNAUTHENTICATED)

  /api/v1/me/recently-viewed:
    get:
      summary: My recently viewed products
      tags: [Features]
      description: '2-9: one card per product, newest first. Query: limit (default 20, max 50).'
      responses:
        '200':
          description: Recently viewed product cards
        '401':
          description: Missing or expired JWT (UNAUTHENTICATED)

  /api/v1/me/recently-viewed/merge:
    post:
      summary: Merge browser history into recently viewed
      tags: [Features]
      description: '2-9: product_ids (max 50) refresh recency in array order; unknown ids are skipped.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_ids]
              properties:
                product_ids:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Merge count
        '400':
          description: Missing array or over 50 ids
        '401':
          description: Missing or expired JWT (UNAUTHENTICATED)

  /api/v1/me/recently-viewed/{productId}:
    delete:
      summary: Remove one recently viewed product
      tags: [Features]
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Removal result (idempotent)
        '401':
          description: Missing or expired JWT (UNAUTHENTICATED)

  /api/v1/me/reviews:
    get:
      summary: Reviews I wrote
      tags: [Features]
      description: '3-9: my reviews newest first with product info, parsed images and seller replies.'
      responses:
        '200':
          description: My reviews
        '401':
          description: Missing or expired JWT (UNAUTHENTICATED)

  /api/v1/me/reviewable:
    get:
      summary: My reviewable purchases
      tags: [Features]
      description: '3-9: delivered/confirmed lines not fully refunded and not reviewed yet, one row per (product, order).'
      responses:
        '200':
          description: Reviewable purchase lines
        '401':
          description: Missing or expired JWT (UNAUTHENTICATED)

  /api/v1/me/order-summary:
    get:
      summary: My order phase counts
      tags: [Features]
      description: '3-9: whole-account upcoming/purchasing/completed counts using the buyer-list phase rule.'
      responses:
        '200':
          description: Order phase counts
        '401':
          description: Missing or expired JWT (UNAUTHENTICATED)

  /api/v1/restock-subscriptions:
    post:
      summary: Subscribe to a restock alert
      tags: [Features]
      description: '2-9: only genuinely stocked-out SKUs (stock_quantity 0); duplicates replay 200.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku_id]
              properties:
                sku_id:
                  type: string
      responses:
        '201':
          description: Subscribed
        '200':
          description: Already subscribed (idempotent replay)
        '400':
          description: Missing sku_id (SKU_REQUIRED)
        '401':
          description: Missing or expired JWT (UNAUTHENTICATED)
        '404':
          description: Unknown SKU (NOT_FOUND)
        '409':
          description: SKU still in stock (STOCK_AVAILABLE)
    delete:
      summary: Cancel a restock alert
      tags: [Features]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku_id]
              properties:
                sku_id:
                  type: string
      responses:
        '200':
          description: Unsubscribed (idempotent)
        '401':
          description: Missing or expired JWT (UNAUTHENTICATED)
        '404':
          description: Unknown SKU (NOT_FOUND)
