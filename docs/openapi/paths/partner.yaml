      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        '201':
          description: Report recorded
        '400':
          description: Invalid reason
        '401':
          description: Missing or expired partner JWT
        '404':
          description: Unknown or foreign review (NOT_FOUND)
        '409':
          description: Duplicate report (REPORT_EXISTS)

  /api/v1/partner/penalties:
    get:
      summary: My penalties
      tags: [Partner]
      responses:
        '200':
          description: Own penalties, newest first
        '401':
          description: Missing or expired partner JWT

  /api/v1/partner/penalties/{id}/appeal:
    post:
      summary: Appeal a penalty once
      tags: [Partner]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
      responses:
        '200':
          description: Appeal recorded
        '400':
          description: Missing appeal body
        '401':
          description: Missing or expired partner JWT
        '404':
          description: Unknown or foreign penalty (NOT_FOUND)
        '409':
          description: Already appealed (APPEAL_EXISTS)

  /api/v1/partner/returns/{id}/pickup:
    put:
      summary: Register return collection tracking
      tags: [Partner]
      description: '2-9: REQUESTED claims only, recorded once; inspection comes next.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [carrier, tracking_number]
              properties:
                carrier:
                  type: string
                tracking_number:
                  type: string
      responses:
        '200':
          description: Collection recorded
        '400':
          description: Bad carrier or tracking shape
        '401':
          description: Missing or expired partner JWT
        '404':
          description: Unknown or foreign claim (NOT_FOUND)
        '409':
          description: Closed claim or already recorded

  /api/v1/partner/returns/{id}/inspect:
    put:
      summary: Record the return inspection
      tags: [Partner]
      description: '2-9: pickup first; DEFECTIVE/MISMATCH flips fault to the seller (approval then drops the return fee). Photos max 5.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result:
                  type: string
                  enum: [NORMAL, DEFECTIVE, MISMATCH]
                memo:
                  type: string
                photos:
                  type: array
                  maxItems: 5
                  items:
                    type: string
      responses:
        '200':
          description: Inspection recorded with resulting fault
        '400':
          description: Bad result, memo or photos
        '401':
          description: Missing or expired partner JWT
        '404':
          description: Unknown or foreign claim (NOT_FOUND)
        '409':
          description: Stage order violated (pickup first, once, while open)
