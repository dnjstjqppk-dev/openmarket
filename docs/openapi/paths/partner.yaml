# Partner paths. Verified against the gateway implementation
# (apps/cloudflare-gateway/src/routes/partner.js). Every route requires a
# ROLE_PARTNER JWT bound to a partner; routes below the approval gate additionally
# require partner status APPROVED (else 403 PARTNER_NOT_APPROVED).
# Retired 2026-11-07: POST /api/v1/partner/media/presigned-url never existed —
# uploads go through POST /api/v1/storage/upload (storage.yaml); product image
# URLs must be https:// or /api/v1/storage/file/. PATCH
# /api/v1/partner/sub-orders/{id}/shipment never existed — the live route is
# PUT|POST /api/v1/partner/orders/{id}/shipment below.
paths:
  /api/v1/partner/products:
    get:
      summary: List the seller's own products with SKU rows
      tags: [Partner]
      description: >
        One row per product-SKU join (a product with N SKUs appears N times).
        Requires APPROVED status.
      responses:
        '200':
          description: Product/SKU rows with option summary and quality score
          content:
            application/json:
              schema:
                type: object
                required: [success, partner_id, count, data]
                properties:
                  success:
                    type: boolean
                  partner_id:
                    type: string
                  business_name:
                    type: string
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
                      required: [option_summary, quality_score]
                      properties:
                        option_summary:
                          type: string
                          description: '"key:value / ..." from option_combination_json, or 기본.'
                        quality_score:
                          type: integer
        '403':
          description: PARTNER_NOT_APPROVED when status is not APPROVED
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'
    post:
      summary: Register a product as DRAFT/PENDING with its first SKU
      tags: [Partner]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, sale_price, category_slug, thumbnail_url]
              properties:
                title:
                  type: string
                  maxLength: 200
                sale_price:
                  type: integer
                  minimum: 100
                  maximum: 100000000
                  description: Aliases price and lowest_sale_price are accepted.
                original_price:
                  type: integer
                  description: Defaults to sale_price; must be >= sale_price.
                stock_quantity:
                  type: integer
                  minimum: 0
                  maximum: 1000000
                  default: 0
                category_slug:
                  type: string
                  description: Active category slug or id (alias category_id).
                thumbnail_url:
                  type: string
                  maxLength: 500
                  description: https:// URL or /api/v1/storage/file/ upload path.
                description_html:
                  type: string
                  maxLength: 200000
                sku_code:
                  type: string
                  maxLength: 60
                  description: Auto-generated when omitted; must be unique.
                option_combination_json:
                  description: Option map as object or JSON string. Defaults to {"옵션":"기본"}.
                hs_code:
                  type: string
                  maxLength: 12
                country_origin:
                  type: string
                  maxLength: 2
                  default: KR
                package_length_cm:
                  type: number
                package_width_cm:
                  type: number
                package_height_cm:
                  type: number
                package_weight_kg:
                  type: number
                warehouse_location:
                  type: string
                  maxLength: 50
                custody_type:
                  type: string
                  enum: [FULL_MANAGED, SEMI_MANAGED]
                  default: SEMI_MANAGED
                supply_price:
                  type: integer
                  minimum: 0
                  maximum: 100000000
                  description: Factory supply price (FULL_MANAGED); null when absent.
                brand:
                  type: string
                  maxLength: 100
                images:
                  type: array
                  maxItems: 10
                  description: '2-9: gallery (own /api/v1/storage/file/ URLs only); first image becomes the thumbnail.'
                  items:
                    type: object
                options:
                  type: array
                  maxItems: 3
                  description: '2-9: option kinds [{name, values[]}].'
                  items:
                    type: object
                skus:
                  type: array
                  maxItems: 200
                  description: '2-9: full SKU set (unique combos, sale <= original); omitted = legacy single SKU from the top-level price/stock.'
                  items:
                    type: object
                notice_template_id:
                  type: string
                  description: '2-9: required notice items must be present in the notice values.'
                notice_values:
                  type: object
                  description: '2-9: notice inputs (aliases notice_info, notice_info_json).'
                shipping_policy_id:
                  type: string
                  description: '2-9: own ACTIVE shipping template.'
                bundle_group_key:
                  type: string
                  maxLength: 64
      responses:
        '201':
          description: Product created for operator review
          content:
            application/json:
              schema:
                type: object
                required: [success, product_id, sku_id, sku_code, status, review_status, data]
                properties:
                  success:
                    type: boolean
                  product_id:
                    type: string
                  sku_id:
                    type: string
                  sku_code:
                    type: string
                  status:
                    type: string
                    example: DRAFT
                  review_status:
                    type: string
                    example: PENDING
                  data:
                    type: object
                  message:
                    type: string
        '400':
          description: CATEGORY_REQUIRED, INVALID_CATEGORY, INVALID_IMAGE_URL, INVALID_OPTIONS, TEMPLATE_TEXT_LEFT ([판매자 작성] leftovers), NOTICE_REQUIRED_MISSING, TOO_MANY_IMAGES/SKUS, DUPLICATE_COMBINATION
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'
        '409':
          description: SKU_CODE_TAKEN
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'

  /api/v1/partner/products/bulk:
    post:
      summary: Bulk-register up to 200 products, all-or-nothing
      tags: [Partner]
      description: >
        Any invalid row aborts the whole batch with 400 BULK_VALIDATION_FAILED
        and nothing is written. Same field contract per row as single registration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required: [title, sale_price]
                    properties:
                      title:
                        type: string
                        maxLength: 200
                      sale_price:
                        type: integer
                        minimum: 100
                        maximum: 100000000
                      original_price:
                        type: integer
                      stock_quantity:
                        type: integer
                        minimum: 0
                        maximum: 1000000
                      category_slug:
                        type: string
                      category_id:
                        type: string
                      thumbnail_url:
                        type: string
                        maxLength: 500
                      sku_code:
                        type: string
                        maxLength: 60
                      option_json:
                        type: string
      responses:
        '201':
          description: All rows registered as DRAFT/PENDING
          content:
            application/json:
              schema:
                type: object
                required: [success, inserted_count, products, data]
                properties:
                  success:
                    type: boolean
                  partner_id:
                    type: string
                  inserted_count:
                    type: integer
                  imported_count:
                    type: integer
                  products:
                    type: array
                    items:
                      type: object
                      required: [row, product_id, sku_id, sku_code, title]
                      properties:
                        row:
                          type: integer
                        product_id:
                          type: string
                        sku_id:
                          type: string
                        sku_code:
                          type: string
                        title:
                          type: string
                  items:
                    type: array
                    items:
                      type: object
                  data:
                    type: object
                  message:
                    type: string
        '400':
          description: EMPTY or BULK_VALIDATION_FAILED with per-row errors
          content:
            application/json:
              schema:
                type: object
                required: [success, code, error, errors]
                properties:
                  success:
                    type: boolean
                  code:
                    type: string
                  error:
                    type: string
                  errors:
                    type: array
                    items:
                      type: object
                      required: [row, error]
                      properties:
                        row:
                          type: integer
                        error:
                          type: string
        '409':
          description: SKU_CODE_TAKEN (duplicate code aborts the batch)
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'

  /api/v1/partner/orders/{id}/shipment:
    put:
      summary: Register the carrier waybill for one sub-order (ships it)
      tags: [Partner]
      description: >
        POST is accepted as an alias of PUT. Only the seller's own sub-orders in
        PAYMENT_CONFIRMED or PREPARING transition to SHIPPED; anything else is
        409 NOT_SHIPPABLE. A bulk variant exists at
        PUT|POST /api/v1/partner/orders/bulk-shipment.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Sub-order id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tracking_number]
              properties:
                carrier:
                  type: string
                  maxLength: 40
                  default: CJ대한통운
                  description: Alias carrier_code is accepted. Free text, no enum.
                tracking_number:
                  type: string
                  description: Must match ^[A-Za-z0-9-]{6,40}$.
      responses:
        '200':
          description: Sub-order transitioned to SHIPPED
          content:
            application/json:
              schema:
                type: object
                required: [success, sub_order_id, carrier, tracking_number, status]
                properties:
                  success:
                    type: boolean
                  sub_order_id:
                    type: string
                  carrier:
                    type: string
                  tracking_number:
                    type: string
                  status:
                    type: string
                    example: SHIPPED
        '400':
          description: INVALID_TRACKING
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'
        '409':
          description: NOT_SHIPPABLE
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'

  /api/v1/partner/orders/bulk-shipment:
    post:
      summary: Register waybills for up to 500 sub-orders, per-row results
      tags: [Partner]
      description: >
        PUT is accepted as an alias of POST. Unlike product bulk upload this is
        NOT atomic: each row ships or fails independently and the response lists
        per-row outcomes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shipments]
              properties:
                shipments:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [sub_order_id, tracking_number]
                    properties:
                      sub_order_id:
                        type: string
                      carrier:
                        type: string
                        maxLength: 40
                      carrier_code:
                        type: string
                        maxLength: 40
                      tracking_number:
                        type: string
      responses:
        '200':
          description: Per-row ship outcomes
          content:
            application/json:
              schema:
                type: object
                required: [success, updated_count, failed_count, results]
                properties:
                  success:
                    type: boolean
                    description: True only when every row shipped.
                  updated_count:
                    type: integer
                  failed_count:
                    type: integer
                  results:
                    type: array
                    items:
                      type: object
                      required: [sub_order_id, ok]
                      properties:
                        sub_order_id:
                          type: string
                        ok:
                          type: boolean
                        error:
                          type: string
        '400':
          description: EMPTY
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'

  /api/v1/partner/settlements:
    get:
      summary: Settlement rows, payout summary and payout history for the seller
      tags: [Partner]
      description: Unpaginated full list (HOLD rows excluded, newest first).
      responses:
        '200':
          description: Settlements with summary and payouts
          content:
            application/json:
              schema:
                type: object
                required: [success, summary, count, settlements, payouts, data]
                properties:
                  success:
                    type: boolean
                  partner_id:
                    type: string
                  business_name:
                    type: string
                  summary:
                    type: object
                    required: [gross_sales, total_commission, adjustments, net_payout, pending_amount, eligible_amount, paid_amount]
                    properties:
                      gross_sales:
                        type: integer
                      total_commission:
                        type: integer
                      adjustments:
                        type: integer
                      net_payout:
                        type: integer
                      pending_amount:
                        type: integer
                      eligible_amount:
                        type: integer
                      paid_amount:
                        type: integer
                      reserve_outstanding:
                        type: integer
                      next_reserve_release:
                        type: string
                        nullable: true
                      rolling_reserve_pct:
                        type: number
                  count:
                    type: integer
                  settlements:
                    type: array
                    items:
                      type: object
                  payouts:
                    type: array
                    items:
                      type: object
                  data:
                    type: object

  /api/v1/partner/tax-invoices:
    get:
      summary: NEW-15. The seller's own commission tax invoices (newest first)
      tags: [Partner]
      responses:
        '200':
          description: Commission tax invoice rows with issue status and approval numbers
          content:
            application/json:
              schema:
                type: object
                required: [success, count, data]
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
        '401':
          description: Missing or expired JWT
        '403':
          description: Not a seller session

  /api/v1/partner/orders:
    get:
      summary: My seller sub-orders with items (newest first, paged)
      tags: [Partner]
      description: '2-9: status, date_field (paid, confirmed, shipped), from/to, q (order no, recipient, product), carrier, page/per_page, format=csv. Contacts are masked; full text needs GET .../{id}/contact with a reason. Access-logged for fulfilment.'
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: date_field
          in: query
          schema:
            type: string
            enum: [paid, confirmed, shipped]
            default: paid
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - name: carrier
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 30
        - name: format
          in: query
          schema:
            type: string
            description: csv returns a masked text/csv download.
      responses:
        '200':
          description: Sub-orders with order_items[] attached (masked contacts)
          content:
            application/json:
              schema:
                type: object
                required: [success, partner_id, count, data]
                properties:
                  success:
                    type: boolean
                  partner_id:
                    type: string
                  count:
                    type: integer
                  pagination:
                    $ref: '../schemas/common.yaml#/components/schemas/OffsetPageMeta'
                  data:
                    type: array
                    items:
                      type: object
        '400':
          description: Invalid status, date_field or period
        '401':
          description: Missing or expired partner JWT

  /api/v1/partner/metrics:
    get:
      summary: Dashboard counters, weekly GMV and fulfillment gauges (all live)
      tags: [Partner]
      description: Gauges are null until measurable — never invented.
      responses:
        '200':
          description: Live metrics bundle (flat, no data envelope)
          content:
            application/json:
              schema:
                type: object
                required: [success, partner_id, products_count, orders_count, weekly_gmv]
                properties:
                  success:
                    type: boolean
                  partner_id:
                    type: string
                  business_name:
                    type: string
                  products_count:
                    type: integer
                  orders_count:
                    type: integer
                  total_sales_amount:
                    type: integer
                  to_ship_count:
                    type: integer
                  settlement_expected_amount:
                    type: integer
                  waiting_qna_count:
                    type: integer
                  open_claims_count:
                    type: integer
                  pending_review_count:
                    type: integer
                  weekly_gmv:
                    type: array
                    maxItems: 7
                    description: Seven UTC-day {day, amount} buckets, oldest first.
                    items:
                      type: object
                      required: [day, amount]
                      properties:
                        day:
                          type: string
                        amount:
                          type: integer
                  wow_pct:
                    type: number
                    nullable: true
                    description: Week-over-week change, null when the prior week is empty.
                  ship_on_time_rate:
                    type: number
                    nullable: true
                    description: Share shipped within 24h, null until shipments exist.
                  avg_delivery_days:
                    type: number
                    nullable: true
                  claim_rate_pct:
                    type: number
                    nullable: true
        '401':
          description: Missing or expired partner JWT

  /api/v1/partner/profile:
    get:
      summary: Read the seller's own profile and payout settings
      tags: [Partner]
      description: >
        Available before approval (no 403 PARTNER_NOT_APPROVED gate). The bank
        account number is masked ("****1234"); echoing the masked value back in
        PUT is not treated as a change.
      responses:
        '200':
          description: Profile bundle with masked payout account
          content:
            application/json:
              schema:
                type: object
                required: [success, partner_id, data]
                properties:
                  success:
                    type: boolean
                  partner_id:
                    type: string
                  data:
                    type: object
                    required: [id, business_name, status]
                    properties:
                      id:
                        type: string
                      business_name:
                        type: string
                      business_reg_number:
                        type: string
                      status:
                        type: string
                        example: APPROVED
                      sales_model:
                        type: string
                      commission_rate:
                        type: number
                      bank_code:
                        type: string
                      bank_account_number:
                        type: string
                        nullable: true
                        description: Masked ("****1234") or null.
                      bank_account_holder:
                        type: string
                      payout_account_verified:
                        type: boolean
                      payout_change_pending:
                        type: boolean
                      settlement_cycle:
                        type: string
                      return_shipping_address:
                        type: string
                      customer_service_phone:
                        type: string
                      base_shipping_fee:
                        type: integer
                      free_shipping_threshold:
                        type: integer
                      return_shipping_fee:
                        type: integer
                        nullable: true
                        description: One-way return courier fee; falls back to base_shipping_fee.
        '401':
          description: Missing or expired JWT, or not a ROLE_PARTNER session
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'
    put:
      summary: Update shop settings and request payout-account changes
      tags: [Partner]
      description: >
        PATCH is accepted as an alias of PUT. Requires APPROVED status
        (403 PARTNER_NOT_APPROVED otherwise). Payout account changes are queued
        for operator verification (payout_change_pending) and never applied
        directly. business_name is locked (409 BUSINESS_NAME_LOCKED).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                settlement_cycle:
                  type: string
                  enum: [WEEKLY, BIWEEKLY, MONTHLY]
                return_shipping_address:
                  type: string
                  maxLength: 200
                customer_service_phone:
                  type: string
                  maxLength: 30
                base_shipping_fee:
                  type: integer
                  minimum: 0
                  maximum: 100000
                free_shipping_threshold:
                  type: integer
                  minimum: 0
                  maximum: 10000000
                return_shipping_fee:
                  type: integer
                  minimum: 0
                  maximum: 100000
                  nullable: true
                bank_code:
                  type: string
                  maxLength: 20
                bank_account_number:
                  type: string
                  maxLength: 30
                  description: Masked echo ("****1234") is ignored, not queued.
                bank_account_holder:
                  type: string
                  maxLength: 50
      responses:
        '200':
          description: Settings saved; payout change queued when bank fields changed
          content:
            application/json:
              schema:
                type: object
                required: [success, message, payout_change_pending]
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  payout_change_pending:
                    type: boolean
        '403':
          description: PARTNER_NOT_APPROVED when status is not APPROVED
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'
        '409':
          description: BUSINESS_NAME_LOCKED
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'

  /api/v1/partner/products/{id}:
    get:
      summary: Read one own product with gallery and SKUs
      tags: [Partner]
      description: '4-3: edit-form read. Only the seller''s own products (404 otherwise).'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Product id.
      responses:
        '200':
          description: Product with images and skus
        '401':
          description: Missing or expired JWT (UNAUTHENTICATED)
        '404':
          description: Unknown product or another seller's (NOT_FOUND)
    put:
      summary: Update a product's content, price and operation model
      tags: [Partner]
      description: >
        PATCH is accepted as an alias of PUT. Only the seller's own products
        (404 otherwise). Changing title, thumbnail or description_html sends an
        ACTIVE/APPROVED product back to DRAFT/PENDING for re-review. Price
        fields follow the same contract as registration (sale, orig defaulting
        to current lowest prices) and propagate to all SKUs. 2-9: images[]
        (gallery replace, own storage only), skus[] (upsert by id, combos
        immutable, price moves journaled; rejects mixed top-level prices),
        notice_template_id/notice values (required items enforced),
        shipping_policy_id and bundle_group_key; [판매자 작성] leftovers refused.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Product id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 200
                description_html:
                  type: string
                  maxLength: 200000
                thumbnail_url:
                  type: string
                category_slug:
                  type: string
                  description: Active category slug or id (alias category_id).
                sale_price:
                  type: integer
                  minimum: 100
                  maximum: 100000000
                  description: Aliases price and lowest_sale_price are accepted.
                original_price:
                  type: integer
                  description: Defaults to current lowest prices when omitted.
                hs_code:
                  type: string
                country_origin:
                  type: string
                custody_type:
                  type: string
                  enum: [FULL_MANAGED, SEMI_MANAGED]
                supply_price:
                  type: integer
                  nullable: true
                  minimum: 0
                  maximum: 100000000
                brand:
                  type: string
                  maxLength: 100
      responses:
        '200':
          description: Product updated; re-review flagged when content changed
          content:
            application/json:
              schema:
                type: object
                required: [success, message, data]
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    required: [product_id, title, sale_price, original_price, review_status]
                    properties:
                      product_id:
                        type: string
                      title:
                        type: string
                      sale_price:
                        type: integer
                      original_price:
                        type: integer
                      review_status:
                        type: string
        '400':
          description: INVALID_CUSTODY or invalid price inputs
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'
        '404':
          description: Not the seller's own product
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'

  /api/v1/partner/products/{id}/price:
    put:
      summary: Update a product's lowest prices across all its SKUs
      tags: [Partner]
      description: >
        PATCH is accepted as an alias of PUT. Only the seller's own products
        (404 otherwise). Does not trigger re-review.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Product id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sale_price:
                  type: integer
                  minimum: 100
                  maximum: 100000000
                  description: Aliases price and lowest_sale_price are accepted.
                original_price:
                  type: integer
                  description: Defaults to current lowest prices when omitted.
      responses:
        '200':
          description: Prices updated on the product and all its SKUs
          content:
            application/json:
              schema:
                type: object
                required: [success, product_id, lowest_sale_price, lowest_original_price]
                properties:
                  success:
                    type: boolean
                  product_id:
                    type: string
                  lowest_sale_price:
                    type: integer
                  lowest_original_price:
                    type: integer
        '404':
          description: Not the seller's own product
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'

  /api/v1/partner/products/{id}/stock:
    put:
      summary: Set a SKU's stock absolutely with optimistic concurrency
      tags: [Partner]
      description: >
        PATCH is accepted as an alias of PUT. stock_quantity is an absolute
        target, not a delta. sku_id selects the SKU (defaults to the product's
        first SKU by sku_code); only the seller's own SKUs (403 otherwise). A
        concurrent checkout between read and write fails with
        409 STOCK_CHANGED. Every adjustment is ledgered in inventory_ledger.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Product id, or a SKU id (sku_id in the body takes precedence).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stock_quantity]
              properties:
                stock_quantity:
                  type: integer
                  minimum: 0
                  maximum: 1000000
                sku_id:
                  type: string
      responses:
        '200':
          description: Stock set and ledgered
          content:
            application/json:
              schema:
                type: object
                required: [success, product_id, sku_id, stock_quantity, previous_stock, delta]
                properties:
                  success:
                    type: boolean
                  product_id:
                    type: string
                  sku_id:
                    type: string
                  stock_quantity:
                    type: integer
                  previous_stock:
                    type: integer
                  delta:
                    type: integer
        '403':
          description: Not the seller's own SKU
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'
        '409':
          description: STOCK_CHANGED when stock moved since the read
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'

  /api/v1/partner/orders/{id}/prepare:
    post:
      summary: Confirm a paid sub-order and start preparation
      tags: [Partner]
      description: >
        Transitions the seller's own sub-order from PAYMENT_CONFIRMED to
        PREPARING; anything else is 409 NOT_CONFIRMABLE. Ships later via
        PUT /api/v1/partner/orders/{id}/shipment.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Sub-order id.
      responses:
        '200':
          description: Sub-order transitioned to PREPARING
          content:
            application/json:
              schema:
                type: object
                required: [success, status]
                properties:
                  success:
                    type: boolean
                  status:
                    type: string
                    example: PREPARING
        '409':
          description: NOT_CONFIRMABLE (wrong status or not the seller's order)
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'

  /api/v1/partner/qna:
    get:
      summary: List product questions addressed to the seller
      tags: [Partner]
      description: Each row carries its product_title. Requires APPROVED status.
      responses:
        '200':
          description: Q&A rows for the seller's products
          content:
            application/json:
              schema:
                type: object
                required: [success, count, data]
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
        '403':
          description: PARTNER_NOT_APPROVED when status is not APPROVED
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'

  /api/v1/partner/qna/{id}/answer:
    post:
      summary: Answer one product question
      tags: [Partner]
      description: >
        Sets the answer and transitions the question to ANSWERED. Only the
        seller's own questions (404 otherwise).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Q&A id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer:
                  type: string
                  maxLength: 2000
      responses:
        '200':
          description: Answer recorded
          content:
            application/json:
              schema:
                type: object
                required: [success, qna_id, status]
                properties:
                  success:
                    type: boolean
                  qna_id:
                    type: string
                  status:
                    type: string
                    example: ANSWERED
        '404':
          description: Not the seller's own question
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'

  /api/v1/partner/returns:
    get:
      summary: List return/exchange claims on the seller's sub-orders
      tags: [Partner]
      description: Each row carries order/sub-order totals and the customer identity. Requires APPROVED status. 2-9: claim_type, status, from/to, page/per_page.
      parameters:
        - name: claim_type
          in: query
          schema:
            type: string
            enum: [RETURN, EXCHANGE, PRICE_ADJUSTMENT]
        - name: status
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: Claim rows for the seller's sub-orders
          content:
            application/json:
              schema:
                type: object
                required: [success, partner_id, count, data]
                properties:
                  success:
                    type: boolean
                  partner_id:
                    type: string
                  count:
                    type: integer
                  pagination:
                    $ref: '../schemas/common.yaml#/components/schemas/OffsetPageMeta'
                  data:
                    type: array
                    items:
                      type: object
        '400':
          description: Invalid claim_type, status or period
        '403':
          description: PARTNER_NOT_APPROVED when status is not APPROVED
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'

  /api/v1/partner/returns/{id}/reship:
    post:
      summary: Register the exchange replacement's waybill (re-ships it)
      tags: [Partner]
      description: >
        Only EXCHANGE claims in APPROVED/AWAITING_RESHIPMENT (409
        NOT_AWAITING_RESHIPMENT otherwise). Replacement stock moves out
        ledgered; return_received=true also restocks the returned option. The
        sub-order re-enters delivery as SHIPPED with the new waybill. A
        batch-assertion guards against double submit.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Claim id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [carrier, tracking_number]
              properties:
                carrier:
                  type: string
                  maxLength: 40
                  description: Alias carrier_code is accepted.
                tracking_number:
                  type: string
                  description: Must match ^[A-Za-z0-9-]{6,40}$.
                return_received:
                  type: boolean
                  description: True restocks the returned option ledgered.
      responses:
        '200':
          description: Replacement shipped, claim RESHIPPED
          content:
            application/json:
              schema:
                type: object
                required: [success, claim_id, exchange_status, sub_order_status]
                properties:
                  success:
                    type: boolean
                  claim_id:
                    type: string
                  exchange_status:
                    type: string
                    example: RESHIPPED
                  sub_order_status:
                    type: string
                    example: SHIPPED
        '400':
          description: INVALID_TRACKING
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Not a claim on the seller's own sub-order
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'
        '409':
          description: NOT_AWAITING_RESHIPMENT, NO_EXCHANGE_ITEMS or EXCHANGE_OUT_OF_STOCK
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'

  /api/v1/partner/returns/{id}:
    put:
      summary: Approve (refund) or reject a return/exchange claim
      tags: [Partner]
      description: >
        POST and the /status suffix are accepted as aliases of
        PUT /api/v1/partner/returns/{id}. Only REQUESTED claims on the seller's
        own sub-orders. decision APPROVE/APPROVED/REFUNDED approves, REJECT/REJECTED
        rejects (notes required). EXCHANGE approvals stop at
        APPROVED/AWAITING_RESHIPMENT with next_action pointing at POST
        /api/v1/partner/returns/{id}/reship; return approvals refund immediately
        (status REFUNDED) with the O14 fault-based return_fee. fault may only be
        shifted to CUSTOMER with a written reason (notes). returnless=true
        approves without restocking.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Claim id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision:
                  type: string
                  description: APPROVE (aliases APPROVED, REFUNDED) or REJECT (alias REJECTED). Alias status is accepted.
                notes:
                  type: string
                  maxLength: 500
                  description: Required for REJECT and CUSTOMER fault overrides. Alias comment is accepted.
                fault:
                  type: string
                  enum: [CUSTOMER, SELLER]
                returnless:
                  type: boolean
                restock:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Claim rejected, exchange approved, or return refunded
          content:
            application/json:
              schema:
                type: object
                required: [success, claim_id, status]
                properties:
                  success:
                    type: boolean
                  claim_id:
                    type: string
                  status:
                    type: string
                    example: REFUNDED
                    description: REJECTED, APPROVED (exchange) or REFUNDED (return).
                  exchange_status:
                    type: string
                    example: AWAITING_RESHIPMENT
                  next_action:
                    type: string
                  fault:
                    type: string
                  return_fee:
                    type: integer
                  refund:
                    type: object
        '400':
          description: INVALID_DECISION, INVALID_FAULT, REASON_REQUIRED or FAULT_REASON_REQUIRED
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'
        '403':
          description: Not a claim on the seller's own sub-order
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'
        '409':
          description: CLAIM_ALREADY_PROCESSED
          content:
            application/json:
              schema:
                $ref: '../schemas/common.yaml#/components/schemas/ErrorResponse'

  /api/v1/partner/dashboard/pipeline:
    get:
      summary: Fulfillment pipeline counts matching the list APIs
      tags: [Partner]
      description: '2-9: new/preparing/due-today/in-transit orders, cancel/return/exchange requests, unanswered qna (24h overdue split), settlement preview, 30-day penalties, latest grade.'
      responses:
        '200':
          description: Pipeline counts
        '401':
          description: Missing or expired partner JWT

  /api/v1/partner/orders/{id}/contact:
    get:
      summary: Full recipient contact for fulfilment
      tags: [Partner]
      description: '2-9: reason query required; every reveal is pii_access_log recorded.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: reason
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Full contact
        '400':
          description: Missing reason (REASON_REQUIRED)
        '401':
          description: Missing or expired partner JWT
        '404':
          description: Unknown or foreign sub-order (NOT_FOUND)

  /api/v1/partner/orders/confirm:
    put:
      summary: Bulk order confirmation (max 200)
      tags: [Partner]
      description: '2-9: own PAYMENT_CONFIRMED rows move to PREPARING with confirmed_at; foreign, missing and wrong-state ids come back in failed[].'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sub_order_ids]
              properties:
                sub_order_ids:
                  type: array
                  maxItems: 200
                  items:
                    type: string
      responses:
        '200':
          description: Updated and failed id lists
        '400':
          description: Empty array or over 200 ids
        '401':
          description: Missing or expired partner JWT

  /api/v1/partner/orders/{id}/delay-notice:
    put:
      summary: Announce a shipment delay
      tags: [Partner]
      description: '2-9: reason plus a new ship-by date later than the current deadline and within 14 days; the buyer gets an inbox notice and a push attempt.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                new_ship_by:
                  type: string
                  description: YYYY-MM-DD (alias new_due_date).
      responses:
        '200':
          description: Extended deadline
        '400':
          description: Missing reason, bad date or outside the (baseline, baseline+14d] window
        '401':
          description: Missing or expired partner JWT
        '404':
          description: Unknown or foreign sub-order (NOT_FOUND)
        '409':
          description: Already shipped (NOT_DELAYABLE)

  /api/v1/partner/shipping-policies:
    get:
      summary: My shipping templates
      tags: [Partner]
      description: '2-9: seller shipping templates.'
      responses:
        '200':
          description: Template list
        '401':
          description: Missing or expired partner JWT
    post:
      summary: Create a shipping template
      tags: [Partner]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, method, fee_type]
              properties:
                name:
                  type: string
                method:
                  type: string
                  enum: [PARCEL, DIRECT, OVERSEAS]
                fee_type:
                  type: string
                  enum: [FREE, PAID, CONDITIONAL, PER_QTY]
                base_fee:
                  type: integer
      responses:
        '201':
          description: Template created
        '400':
          description: Invalid method, fee type or amounts
        '401':
          description: Missing or expired partner JWT

  /api/v1/partner/shipping-policies/{id}:
    put:
      summary: Update a shipping template
      tags: [Partner]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated template
        '401':
          description: Missing or expired partner JWT
        '404':
          description: Unknown or foreign template (NOT_FOUND)
    delete:
      summary: Delete a shipping template
      tags: [Partner]
      description: Refused (409) while products reference the template.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
        '401':
          description: Missing or expired partner JWT
        '404':
          description: Unknown or foreign template (NOT_FOUND)
        '409':
          description: Template in use (TEMPLATE_IN_USE)

  /api/v1/partner/products/bulk-update:
    put:
      summary: Bulk status, price and stock update (max 500)
      tags: [Partner]
      description: '2-9: per-product status (HIDDEN/DRAFT only, never self-activation), price set/ratio/delta (journaled) and stock; failures stay apart. Separate from POST .../products/bulk (CSV registration).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [updates]
              properties:
                updates:
                  type: array
                  maxItems: 500
                  items:
                    type: object
      responses:
        '200':
          description: Updated and failed lists
        '400':
          description: Empty array or over 500 entries
        '401':
          description: Missing or expired partner JWT

  /api/v1/partner/coupons:
    get:
      summary: My store coupons
      tags: [Partner]
      description: '2-9: seller-issued coupons (issuer SELLER, dup_group STORE).'
      responses:
        '200':
          description: Own coupons
        '401':
          description: Missing or expired partner JWT
    post:
      summary: Create a store coupon
      tags: [Partner]
      description: '2-9: issuer/seller/dup-group/burden are server-forced; scope SELLER (store-wide) or PRODUCT/CATEGORY with target_ids.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, title, discount_value]
              properties:
                code:
                  type: string
                title:
                  type: string
                discount_type:
                  type: string
                discount_value:
                  type: integer
                scope:
                  type: string
                target_ids:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Coupon created
        '400':
          description: Invalid discount, scope or targets
        '401':
          description: Missing or expired partner JWT
        '409':
          description: Duplicate code (COUPON_CODE_TAKEN)

  /api/v1/partner/coupons/{id}:
    put:
      summary: Update a store coupon
      tags: [Partner]
      description: '2-9: money and scope freeze once issuance starts (409); suspend (is_active=0) stays allowed.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated coupon
        '401':
          description: Missing or expired partner JWT
        '404':
          description: Unknown or foreign coupon (NOT_FOUND)
        '409':
          description: Frozen after issue start (COUPON_IMMUTABLE_AFTER_ISSUE)

  /api/v1/partner/flash-sales:
    get:
      summary: Flash-sale campaigns with my applications
      tags: [Partner]
      responses:
        '200':
          description: Campaigns (each with my_application or null)
        '401':
          description: Missing or expired partner JWT

  /api/v1/partner/flash-sales/{id}/apply:
    post:
      summary: Apply a SKU to a flash-sale campaign
      tags: [Partner]
      description: '2-9: deal below sale, allocation within stock; queued as REQUESTED for operator review.'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku_id, deal_price, allocated_stock]
              properties:
                sku_id:
                  type: string
                deal_price:
                  type: integer
                allocated_stock:
                  type: integer
      responses:
        '201':
          description: Application queued
        '400':
          description: Deal or allocation invalid
        '401':
          description: Missing or expired partner JWT
        '404':
          description: Unknown campaign or foreign SKU
        '409':
          description: Ended campaign or duplicate application

  /api/v1/partner/payout-requests:
    get:
      summary: My payout requests with available amount
      tags: [Partner]
      responses:
        '200':
          description: Requests, available_amount and account_verified
        '401':
          description: Missing or expired partner JWT
    post:
      summary: Request a payout
      tags: [Partner]
      description: '2-9: X-Idempotency-Key required; over-available, unverified account and in-flight requests are refused.'
      parameters:
        - $ref: '../schemas/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: integer
      responses:
        '201':
          description: Request queued
        '400':
          description: Missing key or bad amount
        '401':
          description: Missing or expired partner JWT
        '409':
          description: Unverified account, over-available or in-flight request

  /api/v1/partner/payout-requests/{id}/cancel:
    post:
      summary: Cancel my payout request
      tags: [Partner]
      description: '2-9: REQUESTED requests only.'
      parameters:
