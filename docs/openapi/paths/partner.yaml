paths:
  /api/v1/partner/media/presigned-url:
    post:
      summary: Issue S3/R2 Presigned PUT URL for direct media upload
      tags: [Partner]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_name, content_type, file_size_bytes]
              properties:
                file_name:
                  type: string
                  maxLength: 255
                content_type:
                  type: string
                  enum: [image/jpeg, image/png, image/webp, video/mp4]
                file_size_bytes:
                  type: integer
                  minimum: 1
                  maximum: 52428800
      responses:
        '200':
          description: Presigned URL issued
          content:
            application/json:
              schema:
                type: object
                required: [upload_url, public_file_url, expires_in_seconds]
                properties:
                  upload_url:
                    type: string
                    format: uri
                  public_file_url:
                    type: string
                    format: uri
                  expires_in_seconds:
                    type: integer

  /api/v1/partner/products:
    post:
      summary: Register product with Cartesian product SKU matrix
      tags: [Partner]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category_id, title, thumbnail_url, description_html, skus]
              properties:
                category_id:
                  type: string
                  format: uuid
                title:
                  type: string
                  minLength: 2
                  maxLength: 200
                thumbnail_url:
                  type: string
                  format: uri
                description_html:
                  type: string
                skus:
                  type: array
                  minItems: 1
                  items:
                    $ref: '../schemas/common.yaml#/components/schemas/SkuItem'
      responses:
        '201':
          description: Product and SKUs created
          content:
            application/json:
              schema:
                type: object
                required: [product_id, created_sku_count]
                properties:
                  product_id:
                    type: string
                    format: uuid
                  created_sku_count:
                    type: integer

  /api/v1/partner/products/bulk:
    post:
      summary: Bulk insert validated products from Web Worker CSV/XLSX parser
      tags: [Partner]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [products]
              properties:
                products:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [category_id, title, thumbnail_url, sku_code, original_price, sale_price, stock_quantity]
                    properties:
                      category_id:
                        type: string
                        format: uuid
                      title:
                        type: string
                      thumbnail_url:
                        type: string
                        format: uri
                      sku_code:
                        type: string
                      original_price:
                        type: integer
                        format: int64
                      sale_price:
                        type: integer
                        format: int64
                      stock_quantity:
                        type: integer
      responses:
        '201':
          description: Bulk registration completed
          content:
            application/json:
              schema:
                type: object
                required: [inserted_count]
                properties:
                  inserted_count:
                    type: integer

  /api/v1/partner/sub-orders/{id}/shipment:
    patch:
      summary: Input carrier and tracking number for a partner sub-order
      tags: [Partner]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [carrier_code, tracking_number]
              properties:
                carrier_code:
                  type: string
                  enum: [CJ_LOGISTICS, HANJIN, LOTTE, POST_OFFICE, DHL, FEDEX]
                tracking_number:
                  type: string
                  minLength: 8
                  maxLength: 40
      responses:
        '200':
          description: Sub-order transitioned to SHIPPED
          content:
            application/json:
              schema:
                type: object
                required: [sub_order_id, status, shipped_at]
                properties:
                  sub_order_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                  shipped_at:
                    type: string
                    format: date-time

  /api/v1/partner/settlements:
    get:
      summary: List partner settlement statements and ledger breakdown
      tags: [Partner]
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Settlement list
          content:
            application/json:
              schema:
                type: object
                required: [items, page_meta]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [settlement_id, period_start, period_end, gross_sales_amount, commission_amount, net_payout_amount, status]
                      properties:
                        settlement_id:
                          type: string
                          format: uuid
                        period_start:
                          type: string
                          format: date
                        period_end:
                          type: string
                          format: date
                        gross_sales_amount:
                          type: integer
                          format: int64
                        commission_amount:
                          type: integer
                          format: int64
                        net_payout_amount:
                          type: integer
                          format: int64
                        status:
                          type: string
                          enum: [PENDING, APPROVED, PAID, HELD]
                  page_meta:
                    $ref: '../schemas/common.yaml#/components/schemas/CursorPageMeta'
