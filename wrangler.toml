name = "openmarket"
compatibility_date = "2024-04-03"
# Apex storefront (olmoa.com after cutover). Static SPA from ASSETS; the crawl
# surface (robots/sitemaps/llms) is forwarded to the API worker, and public page
# paths get edge-rendered head/JSON-LD/summary (6-2) — see the script.
main = "apps/storefront/edge/apex-worker.js"
# Domain account (owns the olmoa.com zone; moved 2026-11-25).
account_id = "f5c363135efe9b22ca66eb39f2f8e1da"
workers_dev = false
routes = [{ pattern = "olmoa.com", custom_domain = true, zone_name = "olmoa.com" }]

[build]
command = "npm run build --workspace=apps/storefront"

[assets]
directory = "./apps/storefront/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Keep identical to RUN_WORKER_FIRST in apps/storefront/edge/apex-worker.js.
# Every page path runs the worker (/{lang}/{currency} prefix, Geo 302, legacy 301,
# edge head); only the hashed bundle and shell-loaded static files skip it.
run_worker_first = ["/*", "!/assets/*", "!/sw.js", "!/theme-init.js", "!/favicon.ico", "!/manifest.webmanifest", "!/icons/*", "!/images/*"]
# Secrets (wrangler secret put / dashboard; never values here):
#   NAVER_SITE_VERIFICATION / GOOGLE_SITE_VERIFICATION — engine ownership codes,
#   injected into <head> of / when set (omit entirely when verifying via DNS TXT).

[[services]]
binding = "API"
service = "olmoa-api"
