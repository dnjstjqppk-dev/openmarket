name = "openmarket"
compatibility_date = "2024-04-03"
# Apex storefront (olmoa.com after cutover). Static SPA from ASSETS; the crawl
# surface (robots/sitemaps/llms) is forwarded to the API worker — see the script.
main = "apps/storefront/edge/apex-worker.js"

[build]
command = "npm run build --workspace=apps/storefront"

[assets]
directory = "./apps/storefront/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Keep identical to CRAWL_PATHS in apps/storefront/edge/apex-worker.js.
run_worker_first = ["/robots.txt", "/sitemap.xml", "/sitemap-index.xml", "/sitemaps/*", "/llms.txt", "/llms-full.txt"]

[[services]]
binding = "API"
service = "olmoa-api"
