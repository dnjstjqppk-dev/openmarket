name: OpenMarket CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend Go & Concurrency Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: Run Backend Integration & State Machine Tests
        run: |
          cd backend
          go test -v ./...

      - name: Run API Server Unit Tests
        run: |
          cd apps/api
          go test -v ./...

  verify-cloudflare-apps:
    name: Build & Verify Cloudflare Apps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Build Frontends
        run: |
          npm ci
          npm run build

      - name: Run In-Memory D1 E2E Verification
        run: npm run test:e2e

      - name: Verify Storefront App Config
        run: |
          cd apps/storefront
          npx wrangler deploy --dry-run

      - name: Verify Admin App Config
        run: |
          cd apps/admin
          npx wrangler deploy --dry-run

      - name: Verify Partner App Config
        run: |
          cd apps/partner
          npx wrangler deploy --dry-run

      - name: Verify Cloudflare D1 Edge Gateway Config
        run: |
          cd apps/cloudflare-gateway
          npx wrangler deploy --dry-run
