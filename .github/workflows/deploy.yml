name: OpenMarket Cloudflare Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-cloudflare:
    name: Build & Deploy 4 Apps to Cloudflare Edge
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # Job-level on purpose: every `wrangler deploy` below re-runs its config's [build]
    # command, so the endpoint env must reach those steps too, not just the first build.
    env:
      # P2-A06: frontend endpoint config lives here, never hardcoded in src.
      # Custom domains since the 2026-11-25 account move (reports/DOMAIN_CUTOVER_RUNBOOK.md).
      # A missing value fails the build instead of shipping a bundle that throws on boot
      # (scripts/vite-require-env.mjs).
      OLMOA_REQUIRE_BUILD_ENV: '1'
      VITE_API_BASE_URL: https://api.olmoa.com
      VITE_STOREFRONT_URL: https://olmoa.com
      VITE_PARTNER_URL: https://partner.olmoa.com
      VITE_ADMIN_URL: https://admin.olmoa.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Build All Frontends
        run: |
          npm ci
          npm run build

      - name: Deploy Edge API Gateway (olmoa-api)
        run: cd apps/cloudflare-gateway && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Root Portal / Storefront
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Admin Console
        run: cd apps/admin && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Partner Console
        run: cd apps/partner && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
