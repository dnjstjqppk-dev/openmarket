name: OpenMarket Cloudflare Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-cloudflare:
    name: Build & Deploy 4 Apps to Cloudflare Edge
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Build All Frontends
        run: |
          npm ci
          npm run build
        env:
          # P2-A06: frontend endpoint config lives here, never hardcoded in src.
          VITE_API_BASE_URL: https://olmoa-api.dnjstjqppk.workers.dev
          VITE_STOREFRONT_URL: https://openmarket.dnjstjqppk.workers.dev
          VITE_PARTNER_URL: https://olmoa-partner.dnjstjqppk.workers.dev
          VITE_ADMIN_URL: https://olmoa-admin.dnjstjqppk.workers.dev

      - name: Deploy Edge API Gateway (olmoa-api)
        run: cd apps/cloudflare-gateway && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Root Portal / Storefront
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Dedicated Storefront Worker
        run: cd apps/storefront && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Admin Console
        run: cd apps/admin && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Partner Console
        run: cd apps/partner && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
