name: OpenMarket Cloudflare Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-cloudflare:
    name: Deploy 4 Apps to Cloudflare
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & build frontends
        run: |
          npm ci
          npm run build

      - name: Deploy Root Portal / Storefront
        run: cd apps/storefront && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Admin Console
        run: cd apps/admin && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Partner Console
        run: cd apps/partner && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Edge API Gateway (D1)
        run: cd apps/cloudflare-gateway && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
